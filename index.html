<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Notary Stamp App</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="data.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f1f5f9; }
        
        /* Header */
        #header { height: 65px; background: #0f172a; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; }
        #header h2 { font-size: 16px; display: flex; align-items: center; gap: 10px; }
        #header h2 i { color: #38bdf8; font-size: 20px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        #lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 8px; border-radius: 8px; }
        #menu-btn:active { background: #1e293b; }

        /* Sidebar */
        #sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 340px; max-width: 85%; background: #1e293b; color: white; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 200; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); }
        
        .side-header { padding: 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .side-header h3 { font-size: 16px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        #close-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }

        .upload-sec { padding: 15px; border-bottom: 1px solid #334155; }
        .upload-btn { display: block; width: 100%; padding: 14px; background: #38bdf8; color: black; text-align: center; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        input[type="file"] { display: none; }

        /* 3-Level Menu Tree */
        #menu-tree { flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        
        .level-btn { width: 100%; background: #334155; border: none; color: white; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 8px; }
        .level-btn i { transition: transform 0.3s; }
        .level-btn.active i { transform: rotate(90deg); color: #38bdf8; }
        
        .nested-container { display: none; padding-left: 10px; border-left: 2px solid #334155; }
        .nested-container.show { display: block; }
        
        .images-container { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; background: #0f172a; border-radius: 10px; margin-bottom: 10px; }
        .images-container.show { display: grid; }
        
        .seal-item { background: white; border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; aspect-ratio: 1; border: 2px solid transparent; }
        .seal-item:active { transform: scale(0.95); border-color: #38bdf8; }
        .seal-item img { max-width: 100%; max-height: 100%; object-fit: contain; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
        #overlay.show { display: block; }

        /* Main Area */
        #main-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        #pdf-controls { background: white; padding: 8px; display: none; justify-content: center; align-items: center; gap: 15px; border-bottom: 1px solid #e2e8f0; position: absolute; top: 0; left: 0; right: 0; z-index: 90; }
        #pdf-controls button { padding: 5px 15px; border: none; background: #0f172a; color: white; border-radius: 6px; cursor: pointer; }
        
        #scroll-area { flex: 1; overflow: auto; padding: 10px; padding-top: 50px; display: flex; justify-content: center; -webkit-overflow-scrolling: touch; }
        
        /* Mobile Perfect A4 Fit */
        #a4-page { width: 794px; height: 1123px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: hidden; flex-shrink: 0; }
        @media (max-width: 850px) { #a4-page { width: 100%; max-width: 794px; height: auto; aspect-ratio: 210 / 297; } }

        #content-layer { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #content-layer img, #content-layer canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Seal Interaction (Mobile Fixed) */
        .seal-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
        
        .move-handle { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; background: #38bdf8; color: black; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: grab; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .resize-handle { position: absolute; bottom: -20px; right: -20px; width: 35px; height: 35px; background: #f59e0b; color: black; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: nwse-resize; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .seal-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        /* Toolbar */
        #toolbar { position: absolute; background: #0f172a; color: white; border-radius: 12px; padding: 8px; display: none; align-items: center; gap: 8px; z-index: 100; transform: translate(-50%, -180%); box-shadow: 0 8px 20px rgba(0,0,0,0.4); white-space: nowrap; }
        #toolbar button { background: none; border: none; color: white; font-size: 16px; padding: 8px; border-radius: 8px; cursor: pointer; }
        #toolbar button:active { background: #38bdf8; color: black; }
        .tb-sep { width: 1px; height: 20px; background: #334155; }

        /* Export Dropdown */
        #bottom-actions { position: fixed; bottom: 15px; right: 15px; z-index: 95; }
        #export-btn { background: #38bdf8; color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; padding: 15px 20px; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        #export-options { position: fixed; bottom: 80px; right: 15px; background: #0f172a; border-radius: 12px; padding: 5px; display: none; flex-direction: column; gap: 5px; z-index: 300; box-shadow: 0 10px 25px rgba(0,0,0,0.4); min-width: 220px; }
        #export-options.show { display: flex; }
        #export-options button { background: none; border: none; color: white; text-align: left; padding: 14px; font-size: 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        #export-options button:active { background: #334155; }
        #export-options button i { color: #38bdf8; }

        /* Loader */
        #loader { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0f172a; padding: 20px; border-radius: 50%; z-index: 500; color: #38bdf8; }
        #loader i { font-size: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            #toolbar { width: 90%; justify-content: space-around; padding: 5px; transform: translate(-50%, -160%); }
            #export-btn { padding: 12px 15px; font-size: 13px; }
            #header h2 { font-size: 14px; }
        }

        @media print {
            body * { visibility: hidden; }
            #a4-page, #a4-page * { visibility: visible; }
            #a4-page { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
            #header, #sidebar, #bottom-actions, #toolbar, #overlay, #pdf-controls, #export-options { display: none !important; }
            #scroll-area { padding: 0; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="header">
        <button id="menu-btn" onclick="toggleSidebar(true)"><i class="fas fa-bars"></i></button>
        <h2 id="app-title"><i class="fas fa-stamp"></i> <span id="title-text">প্রফেশনাল সিল অ্যাপ</span></h2>
        <div class="header-actions">
            <button id="lang-btn" onclick="toggleLanguage()">English</button>
        </div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="side-header">
            <h3 id="sidebar-title"><i class="fas fa-folder-tree"></i> <span id="sidebar-text">সিল লাইব্রেরি</span></h3>
            <button id="close-btn" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="upload-sec">
            <label for="file-upload" class="upload-btn" id="upload-text"><i class="fas fa-file-upload"></i> ডকুমেন্ট আপলোড করুন</label>
            <input id="file-upload" type="file" accept="application/pdf,image/*" onchange="handleFileUpload(event)">
        </div>

        <div id="menu-tree"></div>
    </div>
    <div id="overlay" onclick="toggleSidebar(false)"></div>

    <!-- Main Area -->
    <div id="main-area">
        <div id="pdf-controls">
            <button onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
            <span id="page-num" style="font-weight: bold; color: #0f172a;">১ / ১</span>
            <button onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div id="scroll-area">
            <div id="a4-page">
                <div id="content-layer">
                    <div style="text-align: center; color: #94a3b8;">
                        <i class="fas fa-file-signature fa-5x" style="margin-bottom: 15px; color: #cbd5e1;"></i>
                        <h3 id="doc-placeholder">ডকুমেন্ট আপলোড করুন</h3>
                        <p style="margin-top: 8px; font-size: 14px;" id="doc-instruction">মেনু থেকে সিল সিলেক্ট করুন</p>
                    </div>
                </div>
                
                <div id="toolbar">
                    <button onclick="deleteSeal(this)"><i class="fas fa-trash"></i></button>
                    <div class="tb-sep"></div>
                    <button onclick="rotateSeal(this, -15)"><i class="fas fa-undo"></i></button>
                    <button onclick="rotateSeal(this, 15)"><i class="fas fa-redo"></i></button>
                    <div class="tb-sep"></div>
                    <button onclick="resizeSeal(this, -10)"><i class="fas fa-minus"></i></button>
                    <button onclick="resizeSeal(this, 10)"><i class="fas fa-plus"></i></button>
                    <div class="tb-sep"></div>
                    <input type="range" min="10" max="100" value="100" oninput="changeOpacity(this)" style="width: 50px; accent-color: #38bdf8;">
                </div>
            </div>
        </div>
    </div>

    <!-- Export Button & Dropdown -->
    <div id="bottom-actions">
        <button id="export-btn" onclick="toggleExportMenu()"><i class="fas fa-file-export"></i> <span id="export-text">Export</span></button>
    </div>

    <div id="export-options">
        <button onclick="downloadHDImage()"><i class="fas fa-image"></i> <span id="opt-png">HD ইমেজ (PNG)</span></button>
        <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> <span id="opt-pdf">PDF ডাউনলোড</span></button>
        <button onclick="printPage()"><i class="fas fa-print"></i> <span id="opt-print">প্রিন্ট করুন</span></button>
    </div>

    <div id="loader"><i class="fas fa-circle-notch"></i></div>

    <script>
        let currentPDF = null, currentPage = 1, totalPages = 1, activeSeal = null;
        let currentLang = 'bn';

        // Language Translations
        const translations = {
            bn: {
                title: "প্রফেশনাল সিল অ্যাপ",
                sidebar: "সিল লাইব্রেরি",
                upload: "ডকুমেন্ট আপলোড করুন",
                placeholder: "ডকুমেন্ট আপলোড করুন",
                instruction: "মেনু থেকে সিল সিলেক্ট করুন",
                export: "Export",
                png: "HD ইমেজ (PNG)",
                pdf: "PDF ডাউনলোড",
                print: "প্রিন্ট করুন"
            },
            en: {
                title: "Professional Seal App",
                sidebar: "Seal Library",
                upload: "Upload Document",
                placeholder: "Upload your document",
                instruction: "Select a seal from the menu",
                export: "Export",
                png: "HD Image (PNG)",
                pdf: "Download PDF",
                print: "Print Document"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            const t = translations[currentLang];
            
            document.getElementById('title-text').innerText = t.title;
            document.getElementById('sidebar-text').innerText = t.sidebar;
            document.getElementById('upload-text').innerHTML = `<i class="fas fa-file-upload"></i> ${t.upload}`;
            document.getElementById('doc-placeholder').innerText = t.placeholder;
            document.getElementById('doc-instruction').innerText = t.instruction;
            document.getElementById('export-text').innerText = t.export;
            document.getElementById('opt-png').innerText = t.png;
            document.getElementById('opt-pdf').innerText = t.pdf;
            document.getElementById('opt-print').innerText = t.print;
            
            document.getElementById('lang-btn').innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
            document.documentElement.lang = currentLang;
            
            buildMenu(); // Rebuild menu with new language
        }

        function toggleSidebar(show) { document.getElementById('sidebar').classList.toggle('open', show); document.getElementById('overlay').classList.toggle('show', show); }
        function toggleExportMenu() { document.getElementById('export-options').classList.toggle('show'); }
        document.addEventListener('click', (e) => { if(!e.target.closest('#export-options') && !e.target.closest('#export-btn')) document.getElementById('export-options').classList.remove('show'); });

        // Recursive Menu Builder (3 Levels)
        function buildMenu() {
            const tree = document.getElementById('menu-tree'); tree.innerHTML = '';
            sealData.forEach((root, rIdx) => {
                const div = document.createElement('div'); div.className = 'root-folder';
                const rootName = currentLang === 'bn' ? root.name_bn : root.name_en;
                div.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span><i class="${root.icon}" style="color:#38bdf8; margin-right:10px;"></i>${rootName}</span><i class="fas fa-chevron-right"></i></button>`;
                
                const nested = document.createElement('div');
                nested.className = 'nested-container'; nested.id = `level-${rIdx}`;
                
                if (root.subfolders && root.subfolders.length > 0) {
                    root.subfolders.forEach((sub, sIdx) => {
                        const subName = currentLang === 'bn' ? sub.name_bn : sub.name_en;
                        const subDiv = document.createElement('div');
                        subDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span style="font-size:13px;"><i class="${sub.icon}" style="color:#38bdf8; margin-right:8px;"></i>${subName}</span><i class="fas fa-chevron-right"></i></button>`;
                        
                        const subNested = document.createElement('div');
                        subNested.className = 'nested-container'; subNested.id = `nested-${rIdx}-${sIdx}`;
                        
                        // 3rd Level: Users/Names
                        if (sub.subfolders && sub.subfolders.length > 0) {
                            sub.subfolders.forEach((user, uIdx) => {
                                const userName = currentLang === 'bn' ? user.name_bn : user.name_en;
                                const userDiv = document.createElement('div');
                                userDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span style="font-size:12px;"><i class="${user.icon}" style="color:#38bdf8; margin-right:8px;"></i>${userName}</span><i class="fas fa-chevron-right"></i></button>`;
                                
                                const imgContainer = document.createElement('div');
                                imgContainer.className = 'images-container'; imgContainer.id = `images-${rIdx}-${sIdx}-${uIdx}`;
                                
                                if (user.images && user.images.length > 0) {
                                    user.images.forEach(src => {
                                        const item = document.createElement('div');
                                        item.className = 'seal-item';
                                        item.onclick = () => addSeal(src);
                                        item.innerHTML = `<img src="${src}" onerror="this.src='https://placehold.co/100x100/png?text=Seal'">`;
                                        imgContainer.appendChild(item);
                                    });
                                }
                                
                                userDiv.appendChild(imgContainer);
                                subNested.appendChild(userDiv);
                            });
                        } else if (sub.images) {
                            const imgContainer = document.createElement('div');
                            imgContainer.className = 'images-container'; imgContainer.id = `images-${rIdx}-${sIdx}`;
                            sub.images.forEach(src => {
                                const item = document.createElement('div');
                                item.className = 'seal-item';
                                item.onclick = () => addSeal(src);
                                item.innerHTML = `<img src="${src}" onerror="this.src='https://placehold.co/100x100/png?text=Seal'">`;
                                imgContainer.appendChild(item);
                            });
                            subDiv.appendChild(imgContainer);
                        }
                        
                        subDiv.appendChild(subNested);
                        nested.appendChild(subDiv);
                    });
                }

                div.appendChild(nested);
                tree.appendChild(div);
            });
        }

        function toggleLevel(btn) {
            btn.classList.toggle('active');
            btn.nextElementSibling.classList.toggle('show');
        }

        // File Upload & PDF
        function handleFileUpload(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader(); document.getElementById('loader').style.display = 'block';
            reader.onload = (e) => {
                const container = document.getElementById('content-layer'); container.innerHTML = '';
                if(file.type === 'application/pdf') {
                    const task = pdfjsLib.getDocument({ data: e.target.result });
                    task.promise.then(pdf => { currentPDF = pdf; totalPages = pdf.numPages; currentPage = 1; document.getElementById('pdf-controls').style.display = 'flex'; renderPDFPage(currentPage); });
                } else {
                    currentPDF = null; document.getElementById('pdf-controls').style.display = 'none';
                    const img = document.createElement('img'); img.src = e.target.result;
                    img.onload = () => { img.style.width='100%'; img.style.height='100%'; img.style.objectFit='contain'; container.appendChild(img); document.getElementById('loader').style.display = 'none'; };
                }
            };
            reader.readAsDataURL(file);
        }

        function renderPDFPage(num) {
            const container = document.getElementById('content-layer');
            currentPDF.getPage(num).then(page => {
                const vp = page.getViewport({ scale: 3 }); // 3x scaled canvas for HD quality
                const c = document.createElement('canvas'); const ctx = c.getContext('2d');
                c.width = vp.width; c.height = vp.height;
                page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => {
                    c.style.width='100%'; c.style.height='100%'; c.style.objectFit='contain'; container.appendChild(c);
                    document.getElementById('page-num').innerText = `${num} / ${totalPages}`;
                    document.getElementById('loader').style.display = 'none';
                });
            });
        }
        function nextPage() { if(currentPage < totalPages) { currentPage++; renderPDFPage(currentPage); } }
        function prevPage() { if(currentPage > 1) { currentPage--; renderPDFPage(currentPage); } }

        // Seal Management (Mobile: Touch / Desktop: Mouse)
        function addSeal(src) {
            toggleSidebar(false);
            const page = document.getElementById('a4-page');
            const wrap = document.createElement('div'); wrap.className = 'seal-wrapper'; wrap.style.width='150px'; wrap.style.height='150px';
            
            wrap.innerHTML = `
                <div class="move-handle" onmousedown="startDrag(event, this.parentElement)" ontouchstart="startDrag(event, this.parentElement)"><i class="fas fa-arrows-alt"></i></div>
                <img src="${src}" class="seal-img">
                <div class="resize-handle" onmousedown="startResize(event, this.parentElement)" ontouchstart="startResize(event, this.parentElement)"><i class="fas fa-expand"></i></div>
            `;
            
            page.appendChild(wrap); selectSeal(wrap);
        }

        function selectSeal(el) {
            if(activeSeal) activeSeal.style.outline = 'none';
            activeSeal = el; activeSeal.style.outline = '2px dashed #38bdf8';
            const tb = document.getElementById('toolbar'); tb.style.display = 'flex';
            const r = el.getBoundingClientRect(); const pr = document.getElementById('a4-page').getBoundingClientRect();
            tb.style.left = (r.left - pr.left + r.width/2)+'px'; tb.style.top = (r.top - pr.top)+'px';
            if(window.innerWidth < 600) { tb.style.left='50%'; tb.style.top='10px'; }
        }

        // Unified Drag and Resize for Mouse & Touch (The ultimate fix)
        function startDrag(e, wrap) {
            e.preventDefault();
            const pr = document.getElementById('a4-page').getBoundingClientRect();
            const sx = e.clientX || (e.touches && e.touches[0].clientX);
            const sy = e.clientY || (e.touches && e.touches[0].clientY);
            const ol = wrap.offsetLeft, ot = wrap.offsetTop;
            selectSeal(wrap);
            
            function move(ev) {
                const cx = ev.clientX || (ev.touches && ev.touches[0].clientX);
                const cy = ev.clientY || (ev.touches && ev.touches[0].clientY);
                let nl = ol + (cx - sx), nt = ot + (cy - sy);
                
                // Bounds Check
                if(nl < 0) nl = 0; if(nt < 0) nt = 0;
                if(nl + wrap.offsetWidth > pr.width) nl = pr.width - wrap.offsetWidth;
                if(nt + wrap.offsetHeight > pr.height) nt = pr.height - wrap.offsetHeight;
                
                wrap.style.left = nl+'px'; wrap.style.top = nt+'px';
            }
            function up() { 
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); 
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); 
            }
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up, { passive: false });
        }

        function startResize(e, wrap) {
            e.preventDefault();
            const sx = e.clientX || (e.touches && e.touches[0].clientX);
            const sy = e.clientY || (e.touches && e.touches[0].clientY);
            const sw = wrap.offsetWidth, sh = wrap.offsetHeight;

            function move(ev) {
                const cx = ev.clientX || (ev.touches && ev.touches[0].clientX);
                const cy = ev.clientY || (ev.touches && ev.touches[0].clientY);
                const nw = sw + (cx - sx), nh = sh + (cy - sy);
                if(nw > 50 && nh > 50) { wrap.style.width = nw+'px'; wrap.style.height = nh+'px'; }
            }
            function up() { 
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); 
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); 
            }
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up, { passive: false });
        }

        function deleteSeal(btn) { const w = btn.closest('.seal-wrapper'); if(w) w.remove(); document.getElementById('toolbar').style.display = 'none'; activeSeal = null; }
        function rotateSeal(btn, v) { if(!activeSeal) return; const img = activeSeal.querySelector('.seal-img'); const cr = img.style.transform ? parseFloat(img.style.transform.replace('rotate(','')) : 0; img.style.transform = `rotate(${cr+v}deg)`; }
        function resizeSeal(btn, v) { if(!activeSeal) return; const w = activeSeal.offsetWidth+v, h = activeSeal.offsetHeight+v; if(w>50 && h>50) { activeSeal.style.width=w+'px'; activeSeal.style.height=h+'px'; } }
        function changeOpacity(inp) { if(!activeSeal) return; activeSeal.style.opacity = inp.value/100; }
        function clearAll() { document.querySelectorAll('.seal-wrapper').forEach(el => el.remove()); document.getElementById('toolbar').style.display='none'; activeSeal=null; document.getElementById('content-layer').innerHTML=''; document.getElementById('pdf-controls').style.display='none'; currentPDF=null; }

        // Professional Export
        async function downloadHDImage() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('export-options').classList.remove('show');
            
            const canvas = await html2canvas(document.getElementById('a4-page'), { scale: 4, useCORS: true });
            const link = document.createElement('a');
            link.download = 'notary-document-hd.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            document.getElementById('loader').style.display = 'none';
        }

        async function downloadPDF() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('export-options').classList.remove('show');

            const { jsPDF } = window.jspdf;
            const canvas = await html2canvas(document.getElementById('a4-page'), { scale: 3, useCORS: true });
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
            pdf.save('notary-document.pdf');
            document.getElementById('loader').style.display = 'none';
        }

        function printPage() {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('export-options').classList.remove('show');
            window.print();
        }

        // Initialize
        window.onload = buildMenu;
    </script>
</body>
</html>
