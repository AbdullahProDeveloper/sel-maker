        // ==========================================
        // ইউটিলিটি ফাংশন
        // ==========================================
        
        // টোস্ট নোটিফিকেশন দেখানোর ফাংশন
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.className = type;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ভাষা পরিবর্তন করার ফাংশন
        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            const tr = translations[currentLang];
            
            // UI টেক্সট আপডেট
            document.getElementById('title-text').innerText = tr.title;
            document.getElementById('sidebar-title').innerText = tr.sidebar;
            document.getElementById('quick-upload-text').innerText = tr.quick_upload;
            document.getElementById('doc-placeholder').innerText = tr.placeholder;
            document.getElementById('doc-instruction').innerText = tr.instruction;
            document.getElementById('side-upload-text').innerText = tr.side_upload;
            document.getElementById('side-download-text').innerText = tr.side_download;
            document.getElementById('side-reload-text').innerText = tr.side_reload;
            document.getElementById('export-text').innerText = tr.export;
            document.getElementById('opt-png').innerText = tr.png;
            document.getElementById('opt-jpeg').innerText = tr.jpeg;
            document.getElementById('opt-pdf').innerText = tr.pdf;
            document.getElementById('opt-print').innerText = tr.print;
            document.getElementById('lang-text').innerText = currentLang === 'bn' ? 'EN' : 'বাং';
            document.getElementById('label-recent').innerText = currentLang === 'bn' ? 'সম্প্রতি' : 'Recent';
            document.getElementById('label-library').innerText = currentLang === 'bn' ? 'লাইব্রেরি' : 'Library';
            document.getElementById('search-input').placeholder = currentLang === 'bn' ? 'সিল খুঁজুন...' : 'Search seals...';
            
            // মেনু রিবিল্ড
            buildMenu();
        }

        // সাহায্য দেখানোর ফাংশন
        function showHelp() {
            const tr = translations[currentLang];
            showToast(tr.help, 'info');
        }

        // সাইডবার টগল ফাংশন
        function toggleSidebar(show) {
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('overlay').classList.toggle('show', show);
        }

        // এক্সপোর্ট মেনু টগল ফাংশন
        function toggleExportMenu() {
            const menu = document.getElementById('export-options');
            menu.classList.toggle('show');
            document.getElementById('seal-editor').classList.remove('show');
        }

        // সাইডবার থেকে আপলোড ট্রিগার
        function triggerSidebarUpload() {
            toggleSidebar(false);
            document.getElementById('file-upload').click();
        }

        // সম্প্রতি ব্যবহৃত সিল দেখানো
        function showRecentSeals() {
            if (recentSeals.length === 0) {
                showToast(currentLang === 'bn' ? 'এখনো কোনো সিল ব্যবহার করা হয়নি' : 'No recent seals');
                return;
            }
            toggleSidebar(true);
            showToast(currentLang === 'bn' ? 'সম্প্রতি ব্যবহৃত সিল দেখুন' : 'Select a recent seal');
        }

        // ==========================================
        // উন্নত সার্চ ফাংশনালিটি
        // ==========================================
        function advancedSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const searchStatus = document.getElementById('search-status');
            const searchClear = document.getElementById('search-clear');
            
            // সার্চ ক্লিয়ার বাটন দেখানো/লুকানো
            if (query) {
                searchClear.classList.add('visible');
            } else {
                searchClear.classList.remove('visible');
            }
            
            // সব এলিমেন্ট রিসেট
            const allLevelButtons = document.querySelectorAll('#menu-tree .level-btn');
            const allNested = document.querySelectorAll('#menu-tree .nested-container');
            const allSealItems = document.querySelectorAll('#menu-tree .seal-item');
            const allImagesContainers = document.querySelectorAll('#menu-tree .images-container');

            // সব হাইলাইট রিসেট
            allLevelButtons.forEach(btn => {
                btn.innerHTML = btn.innerHTML.replace(/<mark>/g, '').replace(/<\/mark>/g, '');
                btn.classList.remove('search-match');
            });
            
            allSealItems.forEach(item => {
                item.style.display = 'flex';
                item.classList.remove('search-highlight');
            });

            if (!query) {
                searchStatus.innerText = '';
                allNested.forEach(n => n.classList.remove('show'));
                allLevelButtons.forEach(b => b.classList.remove('active'));
                allImagesContainers.forEach(c => c.classList.remove('show'));
                hideSearchResultBadge();
                return;
            }

            let matchCount = 0;
            let hasSearchResults = false;
            let searchResultNames = [];

            // ডাটা থেকে সার্চ করা
            function searchInImages(images, rootName, subName, subSubName) {
                images.forEach((imgSrc, idx) => {
                    // ইমেজ সার্চ
                    if (rootName.includes(query) || subName.includes(query) || subSubName.includes(query)) {
                        matchCount++;
                        hasSearchResults = true;
                        searchResultNames.push(currentLang === 'bn' ? subSubName : subSubName);
                        
                        // মেনুতে ম্যাচ দেখানো
                        const items = document.querySelectorAll('#menu-tree .seal-item');
                        const imgItem = items[idx];
                        if (imgItem) {
                            imgItem.classList.add('search-highlight');
                            imgItem.style.display = 'flex';
                            
                            // সব প্যারেন্ট খুলে দেওয়া
                            let parent = imgItem.parentElement;
                            while (parent && parent.id !== 'menu-tree') {
                                if (parent.classList.contains('images-container')) parent.classList.add('show');
                                if (parent.classList.contains('nested-container')) parent.classList.add('show');
                                parent = parent.parentElement;
                            }
                        }
                    }
                });
            }

            // ডাটা থেকে সার্চ করা
            sealData.forEach(root => {
                // রুট লেভেল সার্চ
                const rootName = (currentLang === 'bn' ? root.name_bn : root.name_en).toLowerCase();
                
                if (root.subfolders) {
                    root.subfolders.forEach(sub => {
                        // সাবফোল্ডার সার্চ
                        const subName = (currentLang === 'bn' ? sub.name_bn : sub.name_en).toLowerCase();
                        
                        if (sub.subfolders) {
                            sub.subfolders.forEach(subSub => {
                                // সাব-সাবফোল্ডার সার্চ
                                const subSubName = (currentLang === 'bn' ? subSub.name_bn : subSub.name_en).toLowerCase();
                                
                                if (subSub.images) {
                                    searchInImages(subSub.images, rootName, subName, subSubName);
                                }
                            });
                        }
                    });
                }
            });

            // রেজাল্ট দেখানো
            if (hasSearchResults) {
                showSearchResultBadge(`${matchCount} ${translations[currentLang].search_found}`);
                searchStatus.innerText = `${matchCount} ${currentLang === 'bn' ? 'টি সিল পাওয়া গেছে' : 'seals found'}`;
            } else {
                showSearchResultBadge(translations[currentLang].search_notfound);
                searchStatus.innerText = currentLang === 'bn' ? 'পাওয়া যায়নি' : 'Not found';
            }
        }

        // সার্চ ক্লিয়ার ফাংশন
        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear').classList.remove('visible');
            document.getElementById('search-status').innerText = '';
            
            // সব রিসেট
            const allSealItems = document.querySelectorAll('#menu-tree .seal-item');
            allSealItems.forEach(item => {
                item.style.display = 'flex';
                item.classList.remove('search-highlight');
            });
            
            const allNested = document.querySelectorAll('#menu-tree .nested-container');
            allNested.forEach(n => n.classList.remove('show'));
            
            const allLevelButtons = document.querySelectorAll('#menu-tree .level-btn');
            allLevelButtons.forEach(b => b.classList.remove('active', 'search-match'));
            
            hideSearchResultBadge();
        }

        // সার্চ রেজাল্ট ব্যাজ দেখানো
        function showSearchResultBadge(text) {
            const badge = document.getElementById('search-result-badge');
            document.getElementById('search-result-text').innerText = text;
            badge.classList.add('show');
        }

        // সার্চ রেজাল্ট ব্যাজ লুকানো
        function hideSearchResultBadge() {
            const badge = document.getElementById('search-result-badge');
            badge.classList.remove('show');
        }

        // ==========================================
        // মেনু বিল্ডার
        // ==========================================
        function buildMenu() {
            const tree = document.getElementById('menu-tree');
            tree.innerHTML = '';
            
            // sealData ডাটা থেকে মেনু তৈরি
            sealData.forEach((root) => {
                const div = document.createElement('div');
                const rootName = currentLang === 'bn' ? root.name_bn : root.name_en;
                div.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span class="level-name"><i class="${root.icon}"></i>${rootName}</span><i class="fas fa-chevron-right"></i></button>`;
                
                const nested = document.createElement('div');
                nested.className = 'nested-container';
                
                if (root.subfolders && root.subfolders.length > 0) {
                    root.subfolders.forEach(sub => {
                        const subDiv = document.createElement('div');
                        const subName = currentLang === 'bn' ? sub.name_bn : sub.name_en;
                        subDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span class="level-name"><i class="${sub.icon}"></i>${subName}</span><i class="fas fa-chevron-right"></i></button>`;
                        
                        const subNested = document.createElement('div');
                        subNested.className = 'nested-container';
                        
                        if (sub.subfolders && sub.subfolders.length > 0) {
                            sub.subfolders.forEach(subSub => {
                                const subSubDiv = document.createElement('div');
                                const subSubName = currentLang === 'bn' ? subSub.name_bn : subSub.name_en;
                                subSubDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span class="level-name"><i class="${subSub.icon}"></i>${subSubName}</span><i class="fas fa-chevron-right"></i></button>`;
                                
                                const subSubNested = document.createElement('div');
                                subSubNested.className = 'nested-container';
                                
                                if (subSub.images && subSub.images.length > 0) {
                                    const imgC = document.createElement('div');
                                    imgC.className = 'images-container';
                                    
                                    subSub.images.forEach(src => {
                                        const item = document.createElement('div');
                                        item.className = 'seal-item';
                                        item.onclick = () => addSeal(src);
                                        item.innerHTML = `<img src="${src}" alt="seal" loading="lazy">`;
                                        imgC.appendChild(item);
                                    });
                                    
                                    subSubDiv.appendChild(imgC);
                                }
                                
                                subSubDiv.appendChild(subSubNested);
                                subNested.appendChild(subSubDiv);
                            });
                        }
                        
                        subDiv.appendChild(subNested);
                        nested.appendChild(subDiv);
                    });
                }
                
                div.appendChild(nested);
                tree.appendChild(div);
            });
        }

        // লেভেল টগল ফাংশন
        function toggleLevel(btn) {
            btn.classList.toggle('active');
            btn.nextElementSibling.classList.toggle('show');
        }

        // ==========================================
        // ফাইল আপলোড হ্যান্ডলিং
        // ==========================================
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            document.getElementById('loader').style.display = 'block';

            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const container = document.getElementById('content-layer');
                container.innerHTML = '';
                
                // PDF ফাইল হ্যান্ডলিং
                if (file.type === 'application/pdf') {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    
                    loadingTask.promise.then(function(pdf) {
                        currentPDF = pdf;
                        totalPages = pdf.numPages;
                        currentPageNumber = 1;
                        document.getElementById('controls-bar').style.display = 'flex';
                        document.getElementById('page-count-display').innerText = `/ ${totalPages}`;
                        document.getElementById('page-jump').max = totalPages;
                        document.getElementById('page-jump').value = 1;
                        
                        // প্রতিটি পৃষ্ঠা রেন্ডার
                        const renderPage = (pageNum) => {
                            pdf.getPage(pageNum).then(function(page) {
                                const viewport = page.getViewport({ scale: 2 });
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                canvas.width = viewport.width;
                                canvas.height = viewport.height;

                                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                                    const pageContainer = document.createElement('div');
                                    pageContainer.className = 'page-container';
                                    pageContainer.dataset.pageNum = pageNum;
                                    
                                    const pageDiv = document.createElement('div');
                                    pageDiv.className = 'a4-page';
                                    if (pageNum === 1) {
                                        pageDiv.classList.add('current-page');
                                        currentPageElement = pageDiv;
                                    }
                                    pageDiv.style.display = (pageNum === 1) ? 'block' : 'none';
                                    
                                    canvas.style.width = '100%';
                                    canvas.style.height = '100%';
                                    canvas.style.objectFit = 'contain';
                                    
                                    pageDiv.appendChild(canvas);
                                    pageContainer.appendChild(pageDiv);
                                    container.appendChild(pageContainer);
                                });
                            });
                        };
                        
                        // সব পৃষ্ঠা রেন্ডার করা
                        for (let i = 1; i <= pdf.numPages; i++) {
                            renderPage(i);
                        }
                        
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_upload);
                    }).catch(function() {
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_error, 'error');
                    });
                } 
                // ইমেজ ফাইল হ্যান্ডলিং
                else if (file.type.startsWith('image/')) {
                    currentPDF = null;
                    document.getElementById('controls-bar').style.display = 'none';
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.onload = function() {
                        const pageContainer = document.createElement('div');
                        pageContainer.className = 'page-container';
                        
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'a4-page current-page';
                        currentPageElement = pageDiv;
                        
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'contain';
                        
                        pageDiv.appendChild(img);
                        pageContainer.appendChild(pageDiv);
                        container.appendChild(pageContainer);
                        
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_upload);
                    };
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ==========================================
        // পেজিনেশন
        // ==========================================
        function nextPage() {
            if (currentPageNumber < totalPages) {
                const pages = document.querySelectorAll('.a4-page');
                pages.forEach(p => p.classList.remove('current-page'));
                pages[currentPageNumber].classList.add('current-page');
                currentPageElement = pages[currentPageNumber];
                pages[currentPageNumber - 1].style.display = 'none';
                pages[currentPageNumber].style.display = 'block';
                currentPageNumber++;
                document.getElementById('page-jump').value = currentPageNumber;
                document.getElementById('prev-btn').disabled = false;
                if (currentPageNumber === totalPages) document.getElementById('next-btn').disabled = true;
                
                document.getElementById('scroll-area').scrollTop = 0;
                closeSealEditor();
            }
        }

        function prevPage() {
            if (currentPageNumber > 1) {
                const pages = document.querySelectorAll('.a4-page');
                pages.forEach(p => p.classList.remove('current-page'));
                pages[currentPageNumber - 2].classList.add('current-page');
                currentPageElement = pages[currentPageNumber - 2];
                pages[currentPageNumber - 1].style.display = 'none';
                pages[currentPageNumber - 2].style.display = 'block';
                currentPageNumber--;
                document.getElementById('page-jump').value = currentPageNumber;
                document.getElementById('next-btn').disabled = false;
                if (currentPageNumber === 1) document.getElementById('prev-btn').disabled = true;
                
                document.getElementById('scroll-area').scrollTop = 0;
                closeSealEditor();
            }
        }

        function jumpToPage() {
            let val = parseInt(document.getElementById('page-jump').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > totalPages) val = totalPages;
            
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach((page, idx) => {
                page.classList.remove('current-page');
                page.style.display = (idx === val - 1) ? 'block' : 'none';
                if (idx === val - 1) {
                    page.classList.add('current-page');
                    currentPageElement = page;
                }
            });
            
            currentPageNumber = val;
            document.getElementById('prev-btn').disabled = (val === 1);
            document.getElementById('next-btn').disabled = (val === totalPages);
            
            document.getElementById('scroll-area').scrollTop = 0;
            closeSealEditor();
        }

        // ==========================================
        // জুম ফাংশনালিটি
        // ==========================================
        function changeZoom(delta) {
            currentZoom = Math.max(0.5, Math.min(2.5, currentZoom + delta));
            document.getElementById('zoom-value').innerText = Math.round(currentZoom * 100) + '%';
            
            const pages = document.querySelectorAll('.page-container');
            pages.forEach(page => {
                page.style.maxWidth = `${794 * currentZoom}px`;
            });
        }

        // ==========================================
        // সিল ম্যানেজমেন্ট
        // ==========================================
        function addSeal(src) {
            if (!currentPageElement) {
                showToast(currentLang === 'bn' ? 'প্রথমে ডকুমেন্ট আপলোড করুন' : 'Upload a document first', 'error');
                return;
            }

            toggleSidebar(false);

            const wrap = document.createElement('div');
            wrap.className = 'seal-wrapper normal-state';
            wrap.style.width = '120px';
            wrap.style.height = '120px';
            wrap.style.left = '50%';
            wrap.style.top = '50%';
            wrap.style.transform = 'translate(-50%, -50%)';
            
            wrap.innerHTML = `
                <img src="${src}" class="seal-img" alt="seal">
            `;

            // টাচ ড্র্যাগ সাপোর্ট
            wrap.addEventListener('touchstart', function(e) {
                e.stopPropagation();
                activateSeal(wrap);
                if (!e.target.closest('.seal-img')) return;
                startTouchDrag(e, wrap);
            }, { passive: false });

            // ক্লিক ইভেন্ট
            wrap.addEventListener('click', function(e) {
                e.stopPropagation();
                activateSeal(wrap);
                openSealEditor();
            });

            currentPageElement.appendChild(wrap);

            // সম্প্রতি ব্যবহৃত সিলে যোগ করা
            if (!recentSeals.includes(src)) {
                recentSeals.unshift(src);
                if (recentSeals.length > 5) recentSeals.pop();
            }

            showToast(translations[currentLang].toast_seal);
        }

        // টাচ ড্র্যাগ ফাংশন
        function startTouchDrag(e, wrap) {
            e.preventDefault();
            
            const touch = e.touches[0];
            const rect = wrap.parentElement.getBoundingClientRect();
            const pr = wrap.parentElement;
            
            let startX = touch.clientX - rect.left;
            let startY = touch.clientY - rect.top;
            let startLeft = wrap.offsetLeft;
            let startTop = wrap.offsetTop;
            
            function onTouchMove(ev) {
                ev.preventDefault();
                const t = ev.touches[0];
                const x = t.clientX - rect.left;
                const y = t.clientY - rect.top;
                
                let newLeft = startLeft + (x - startX);
                let newTop = startTop + (y - startY);
                
                newLeft = Math.max(0, Math.min(newLeft, pr.offsetWidth - wrap.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, pr.offsetHeight - wrap.offsetHeight));
                
                wrap.style.left = newLeft + 'px';
                wrap.style.top = newTop + 'px';
            }
            
            function onTouchEnd() {
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }
            
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            document.addEventListener('touchend', onTouchEnd);
        }

        // সিল অ্যাক্টিভেট ফাংশন
        function activateSeal(el) {
            document.querySelectorAll('.seal-wrapper').forEach(w => {
                w.classList.remove('active-state');
            });
            
            el.classList.add('active-state');
            activeSeal = el;
        }

        // সিল এডিটর খোলা
        function openSealEditor() {
            const editor = document.getElementById('seal-editor');
            editor.classList.add('show');
            
            // বর্তমান ভ্যালু সেট করা
            if (activeSeal) {
                const currentSize = parseInt(activeSeal.style.width) || 120;
                document.getElementById('editor-size').value = currentSize;
                
                const currentOpacity = Math.round(parseFloat(activeSeal.style.opacity || 1) * 100);
                document.getElementById('editor-opacity').value = currentOpacity;
            }
            
            document.getElementById('export-options').classList.remove('show');
        }

        // সিল এডিটর বন্ধ করা
        function closeSealEditor() {
            document.getElementById('seal-editor').classList.remove('show');
            if (activeSeal) {
                activeSeal.classList.remove('active-state');
                activeSeal = null;
            }
        }

        // সাইজ পরিবর্তন ফাংশন
        function editorSizeChange(value) {
            if (!activeSeal) return;
            activeSeal.style.width = value + 'px';
            activeSeal.style.height = value + 'px';
        }

        // অপাসিটি পরিবর্তন ফাংশন
        function editorOpacityChange(value) {
            if (!activeSeal) return;
            activeSeal.style.opacity = value / 100;
        }

        // সিল সেন্টার করা
        function centerSeal() {
            if (!activeSeal || !currentPageElement) return;
            activeSeal.style.left = '50%';
            activeSeal.style.top = '50%';
            activeSeal.style.transform = 'translate(-50%, -50%)';
        }

        // সিল সরানো
        function moveSeal(dx, dy) {
            if (!activeSeal) return;
            
            const currentLeft = parseFloat(activeSeal.style.left) || 0;
            const currentTop = parseFloat(activeSeal.style.top) || 0;
            
            activeSeal.style.left = (currentLeft + dx) + 'px';
            activeSeal.style.top = (currentTop + dy) + 'px';
        }

        // সিল ডুপ্লিকেট করা
        function duplicateSeal() {
            if (!activeSeal) return;
            
            const src = activeSeal.querySelector('.seal-img').src;
            const newSeal = activeSeal.cloneNode(true);
            
            // নতুন সিলের অবস্থান
            const currentLeft = parseFloat(activeSeal.style.left) || 0;
            const currentTop = parseFloat(activeSeal.style.top) || 0;
            newSeal.style.left = (currentLeft + 20) + 'px';
            newSeal.style.top = (currentTop + 20) + 'px';
            
            // নতুন সিলের ক্লিক ইভেন্ট
            newSeal.addEventListener('click', function(e) {
                e.stopPropagation();
                activateSeal(newSeal);
                openSealEditor();
            });
            
            newSeal.addEventListener('touchstart', function(e) {
                e.stopPropagation();
                activateSeal(newSeal);
                if (!e.target.closest('.seal-img')) return;
                startTouchDrag(e, newSeal);
            }, { passive: false });
            
            currentPageElement.appendChild(newSeal);
            
            showToast(currentLang === 'bn' ? '✓ সিল ডুপ্লিকেট করা হয়েছে!' : '✓ Seal duplicated!');
        }

        // রোটেশন রিসেট করা
        function resetRotation() {
            if (!activeSeal) return;
            const img = activeSeal.querySelector('.seal-img');
            img.style.transform = 'rotate(0deg)';
            img.dataset.rotation = 0;
        }

        // আউটসাইড ক্লিক হ্যান্ডলার
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.seal-wrapper') && !e.target.closest('#seal-editor') && !e.target.closest('#export-options')) {
                closeSealEditor();
                document.getElementById('export-options').classList.remove('show');
            }
        });

        // ==========================================
        // সিল ম্যানিপুলেশন
        // ==========================================
        
        // ড্র্যাগ স্টার্ট ফাংশন (ডেস্কটপ)
        function startDrag(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const wrap = e.target.closest('.seal-wrapper');
            const pr = wrap.parentElement;
            
            const sx = e.clientX;
            const sy = e.clientY;
            
            dragData = {
                wrap: wrap,
                ol: wrap.offsetLeft,
                ot: wrap.offsetTop,
                sx: sx,
                sy: sy,
                pr: pr
            };
            
            function move(ev) {
                const cx = ev.clientX;
                const cy = ev.clientY;
                let nl = dragData.ol + (cx - dragData.sx);
                let nt = dragData.ot + (cy - dragData.sy);
                
                nl = Math.max(0, Math.min(nl, dragData.pr.offsetWidth - dragData.wrap.offsetWidth));
                nt = Math.max(0, Math.min(nt, dragData.pr.offsetHeight - dragData.wrap.offsetHeight));
                
                dragData.wrap.style.left = nl + 'px';
                dragData.wrap.style.top = nt + 'px';
            }
            
            function up() {
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
                dragData = null;
            }
            
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
        }

        // সিল ডিলিট ফাংশন
        function deleteSeal() {
            if (activeSeal) {
                activeSeal.remove();
                closeSealEditor();
                showToast(translations[currentLang].toast_delete);
            }
        }

        // সব সিল মুছে ফেলা
        function clearAllSeals() {
            const allSeals = document.querySelectorAll('.seal-wrapper');
            if (allSeals.length === 0) {
                showToast(currentLang === 'bn' ? 'কোনো সিল নেই' : 'No seals found');
                return;
            }
            allSeals.forEach(seal => seal.remove());
            closeSealEditor();
            showToast(currentLang === 'bn' ? 'সকল সিল মুছে ফেলা হয়েছে' : 'All seals removed');
        }

        // সিল রোটেট ফাংশন
        function rotateSeal(angle) {
            if (!activeSeal) return;
            
            const img = activeSeal.querySelector('.seal-img');
            const currentRotation = parseFloat(img.dataset.rotation || 0);
            const newRotation = currentRotation + angle;
            img.style.transform = `rotate(${newRotation}deg)`;
            img.dataset.rotation = newRotation;
        }

        // ==========================================
        // এক্সপোর্ট ফাংশন
        // ==========================================
        
        // HD ইমেজ ডাউনলোড
        async function downloadHDImage(format) {
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => {
                w.classList.remove('active-state');
            });
            
            const pageContainers = document.querySelectorAll('.page-container');
            if (pageContainers.length === 0) return;
            
            document.getElementById('loader').style.display = 'block';
            
            try {
                const zip = new JSZip();
                const folder = zip.folder('document_pages');
                
                for (let i = 0; i < pageContainers.length; i++) {
                    const canvas = await html2canvas(pageContainers[i], { scale: 4, useCORS: true });
                    const imgData = canvas.toDataURL(format === 'jpeg' ? 'image/jpeg' : 'image/png');
                    
                    // এক পেজ হলে সরাসরি ডাউনলোড
                    if (pageContainers.length === 1) {
                        const link = document.createElement('a');
                        link.download = `document-page-${i + 1}.${format}`;
                        link.href = imgData;
                        link.click();
                    } 
                    // একাধিক পেজ হলে ZIP ফাইলে
                    else {
                        folder.file(`page-${i + 1}.${format}`, imgData.split(',')[1], { base64: true });
                    }
                    
                    await new Promise(r => setTimeout(r, 300));
                }
                
                // একাধিক পেজ হলে ZIP ডাউনলোড
                if (pageContainers.length > 1) {
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.download = 'document-pages.zip';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                }
                
                document.getElementById('loader').style.display = 'none';
                showToast(translations[currentLang].toast_download);
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                showToast('✗ ' + error.message, 'error');
            }
        }

        // PDF ডাউনলোড
        async function downloadPDF() {
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => {
                w.classList.remove('active-state');
            });
            
            const pageContainers = document.querySelectorAll('.page-container');
            if (pageContainers.length === 0) return;
            
            document.getElementById('loader').style.display = 'block';
            
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                for (let i = 0; i < pageContainers.length; i++) {
                    const canvas = await html2canvas(pageContainers[i], { scale: 3, useCORS: true });
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    
                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                    
                    await new Promise(r => setTimeout(r, 300));
                }
                
                pdf.save('document.pdf');
                document.getElementById('loader').style.display = 'none';
                showToast(translations[currentLang].toast_download);
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                showToast('✗ ' + error.message, 'error');
            }
        }

        // প্রিন্ট ফাংশন
        function printPage() {
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => {
                w.classList.remove('active-state');
            });
            
            showToast(translations[currentLang].toast_print);
            setTimeout(() => {
                window.print();
            }, 500);
        }

        // ==========================================
        // কীবোর্ড শর্টকাট
        // ==========================================
        document.addEventListener('keydown', function(e) {
            // ডিলিট কী
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (activeSeal) {
                    deleteSeal();
                }
            }
            
            // ESC কী
            if (e.key === 'Escape') {
                toggleSidebar(false);
                document.getElementById('export-options').classList.remove('show');
                closeSealEditor();
            }
            
            // অ্যারো কী - পেজ নেভিগেশন
            if (e.key === 'ArrowLeft') {
                prevPage();
            }
            
            if (e.key === 'ArrowRight') {
                nextPage();
            }
        });

        // ==========================================
        // এক্সপোর্ট মেনু আউটসাইড ক্লিক
        // ==========================================
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#export-options') && !e.target.closest('#export-btn')) {
                document.getElementById('export-options').classList.remove('show');
            }
        });

        // ==========================================
        // ইনিশিয়ালাইজেশন
        // ==========================================
        window.addEventListener('DOMContentLoaded', function() {
            // মেনু বিল্ড করা
            buildMenu();
            
            // সার্চ ইনপুটে কীবোর্ড ইভেন্ট
            document.getElementById('search-input').addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    clearSearch();
                }
            });
        });
    </script>
</body>
