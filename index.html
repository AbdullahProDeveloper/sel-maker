<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Notary Seal App</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="data.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f1f5f9; }

        /* Header */
        #header { height: 60px; background: linear-gradient(135deg, #0f172a, #1e293b); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #header h2 { font-size: 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
        #header h2 i { color: #6366f1; font-size: 24px; }
        #lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* Top Upload Bar */
        #quick-upload { background: #1e293b; padding: 12px 15px; border-bottom: 1px solid #334155; }
        #quick-upload-btn { background: linear-gradient(135deg, #6366f1, #818cf8); color: white; border: none; border-radius: 12px; padding: 15px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
        input[type="file"] { display: none; }

        /* Sidebar */
        #sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 350px; max-width: 88%; background: linear-gradient(180deg, #1e293b, #0f172a); color: white; transform: translateX(-100%); transition: 0.3s; z-index: 200; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); }
        .side-header { padding: 15px; background: rgba(2, 6, 23, 0.5); display: flex; justify-content: space-between; align-items: center; }
        .side-header h3 { color: #818cf8; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        #close-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        
        /* Sidebar Action Buttons */
        #sidebar-actions { padding: 10px; border-bottom: 1px solid #334155; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
        .side-action-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; justify-content: center; flex: 1; }
        .side-action-btn:active { background: #6366f1; }
        .side-action-btn i { font-size: 14px; }

        /* Search Filter */
        #menu-search { padding: 10px; border-bottom: 1px solid #334155; }
        #menu-search input { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        #menu-search input::placeholder { color: #94a3b8; }
        #menu-search input:focus { border-color: #6366f1; }

        #menu-tree { flex: 1; overflow-y: auto; padding: 15px; }
        
        .level-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 10px; }
        .level-btn i { color: #818cf8; transition: 0.3s; }
        .level-btn.active i { transform: rotate(90deg); }
        .nested-container { display: none; padding-left: 12px; border-left: 2px solid #334155; }
        .nested-container.show { display: block; }
        .images-container { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; background: rgba(2, 6, 23, 0.5); border-radius: 10px; }
        .images-container.show { display: grid; }
        .seal-item { background: white; border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; aspect-ratio: 1; border: 2px solid transparent; }
        .seal-item:active { transform: scale(0.95); border-color: #6366f1; }
        .seal-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
        #overlay.show { display: block; }

        /* Main Area */
        #main-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* Page Navigation */
        #pdf-controls { background: white; padding: 8px; display: none; justify-content: center; align-items: center; gap: 15px; border-bottom: 1px solid #e2e8f0; position: absolute; top: 0; left: 0; right: 0; z-index: 90; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #pdf-controls button { padding: 8px 15px; border: none; background: #0f172a; color: white; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        #pdf-controls button:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
        #page-jump { width: 50px; text-align: center; border: 1px solid #e2e8f0; border-radius: 6px; padding: 5px; font-size: 13px; font-weight: bold; }
        #page-count-display { font-size: 13px; font-weight: bold; color: #0f172a; }

        /* Zoom Controls */
        #zoom-controls { background: white; padding: 8px; display: flex; justify-content: center; align-items: center; gap: 10px; border-bottom: 1px solid #e2e8f0; position: absolute; top: 45px; left: 0; right: 0; z-index: 90; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #zoom-controls button { background: #0f172a; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        #zoom-value { font-size: 13px; font-weight: bold; color: #0f172a; }

        #scroll-area { flex: 1; overflow-y: auto; padding: 10px; padding-top: 95px; display: flex; flex-direction: column; align-items: center; -webkit-overflow-scrolling: touch; }
        
        /* A4 Pages */
        .a4-page { width: 794px; height: 1123px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; overflow: hidden; flex-shrink: 0; margin-bottom: 20px; }
        @media (max-width: 850px) { 
            .a4-page { 
                width: 100%; 
                max-width: 794px; 
                height: auto; 
                max-height: calc(100vh - 180px); 
                aspect-ratio: 210/297; 
                overflow-y: auto; 
            }
        }

        #content-layer { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }

        /* Seal Interaction */
        .seal-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .seal-wrapper.normal-state { border: none; }
        .seal-wrapper.normal-state .handle { display: none; }
        .seal-wrapper.active-state { outline: 2px dashed #6366f1; }
        .seal-wrapper.active-state .handle { display: flex; }

        .seal-wrapper, .seal-wrapper * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .seal-wrapper { touch-action: none; }

        .handle { position: absolute; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: white; z-index: 20; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .move-handle { top: -25px; left: 50%; transform: translateX(-50%); background: #6366f1; cursor: grab; }
        .resize-handle { bottom: -25px; right: -25px; background: #f59e0b; cursor: nwse-resize; }
        .rotate-handle { top: -25px; right: -25px; background: #10b981; cursor: grab; }
        .delete-handle { bottom: -25px; left: -25px; background: #ef4444; cursor: pointer; }
        
        .seal-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        /* Toolbar */
        #toolbar { position: absolute; background: rgba(15, 23, 42, 0.95); color: white; border-radius: 12px; padding: 8px; display: none; align-items: center; gap: 10px; z-index: 100; transform: translate(-50%, -180%); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        #toolbar button { background: none; border: none; color: white; font-size: 16px; padding: 10px; border-radius: 8px; cursor: pointer; }
        #toolbar button:active { background: #6366f1; }
        .tb-sep { width: 1px; height: 25px; background: #334155; }
        #opacity-slider { width: 50px; accent-color: #6366f1; }

        #bottom-actions { position: fixed; bottom: 70px; right: 15px; z-index: 95; }
        #export-btn { background: linear-gradient(135deg, #6366f1, #818cf8); color: white; border: none; border-radius: 12px; padding: 15px 20px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(99,102,241,0.4); }
        #export-options { position: fixed; bottom: 130px; right: 15px; background: rgba(15, 23, 42, 0.95); border-radius: 12px; padding: 8px; display: none; flex-direction: column; gap: 8px; z-index: 300; min-width: 220px; }
        #export-options.show { display: flex; }
        #export-options button { background: rgba(255,255,255,0.05); border: none; color: white; text-align: left; padding: 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        #export-options button:active { background: #6366f1; }

        #footer { background: linear-gradient(135deg, #0f172a, #1e293b); color: #94a3b8; text-align: center; padding: 14px; font-size: 13px; font-weight: 600; position: fixed; bottom: 0; left: 0; right: 0; z-index: 96; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(15, 23, 42, 0.95); color: white; padding: 15px 25px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 1000; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { border: 1px solid #10b981; }
        #toast.error { border: 1px solid #ef4444; }

        #loader { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.9); padding: 20px; border-radius: 50%; z-index: 500; color: #818cf8; }
        #loader i { font-size: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            #header h2 { font-size: 15px; }
            #quick-upload-btn { font-size: 13px; padding: 13px; }
            #toolbar { width: 95%; justify-content: space-around; padding: 6px; }
            #pdf-controls { padding: 6px; gap: 8px; }
            #zoom-controls { top: 40px; }
        }

        @media print { 
            body * { visibility: hidden; } 
            #scroll-area { padding: 0; }
            .a4-page, .a4-page * { visibility: visible; } 
            .a4-page { position: static !important; width: 100% !important; height: 100% !important; aspect-ratio: auto !important; max-height: none !important; box-shadow: none; margin-bottom: 0; }
            #header, #footer, #bottom-actions, #toolbar, #sidebar, #quick-upload, #overlay, #pdf-controls, #zoom-controls { display: none !important; }
        }
    </style>
</head>
<body>

    <header id="header">
        <button id="menu-btn" onclick="toggleSidebar(true)"><i class="fas fa-bars"></i></button>
        <h2><i class="fas fa-stamp"></i> <span id="title-text">প্রফেশনাল সিল অ্যাপ</span></h2>
        <button id="lang-btn" onclick="toggleLanguage()">English</button>
    </header>

    <div id="quick-upload">
        <label for="file-upload" id="quick-upload-btn"><i class="fas fa-cloud-upload-alt"></i> <span id="quick-upload-text">যেকোনো ডকুমেন্ট আপলোড করুন</span></label>
        <input id="file-upload" type="file" accept="application/pdf,image/*" onchange="handleFileUpload(event)">
    </div>

    <div id="sidebar">
        <div class="side-header">
            <h3><i class="fas fa-folder-tree"></i> <span id="sidebar-title">সিল লাইব্রেরি</span></h3>
            <button id="close-btn" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        
        <div id="sidebar-actions">
            <button class="side-action-btn" onclick="triggerSidebarUpload()"><i class="fas fa-cloud-upload-alt"></i> <span id="side-upload-text">আপলোড</span></button>
            <button class="side-action-btn" onclick="downloadHDImage('png')"><i class="fas fa-download"></i> <span id="side-download-text">ডাউনলোড</span></button>
            <button class="side-action-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> <span id="side-reload-text">রিলোড</span></button>
        </div>

        <!-- Search Filter -->
        <div id="menu-search">
            <input type="text" id="search-input" placeholder="সিল খুঁজুন..." oninput="filterMenu()">
        </div>

        <div id="menu-tree"></div>
    </div>
    <div id="overlay" onclick="toggleSidebar(false)"></div>

    <div id="main-area">
        <!-- Page Navigation -->
        <div id="pdf-controls">
            <button id="prev-btn" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
            <input type="number" id="page-jump" min="1" value="1" onchange="jumpToPage()">
            <span id="page-count-display">/ 1</span>
            <button id="next-btn" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- Zoom Controls -->
        <div id="zoom-controls">
            <button onclick="changeZoom(-0.1)"><i class="fas fa-minus"></i></button>
            <span id="zoom-value">100%</span>
            <button onclick="changeZoom(0.1)"><i class="fas fa-plus"></i></button>
        </div>

        <div id="scroll-area">
            <div id="content-layer">
                <div style="text-align: center; padding-top: 100px; color: #94a3b8;">
                    <i class="fas fa-file-upload fa-5x" style="margin-bottom: 15px; color: #cbd5e1;"></i>
                    <h3 id="doc-placeholder">ডকুমেন্ট আপলোড করুন</h3>
                    <p style="margin-top: 8px; font-size: 13px; color: #64748b;" id="doc-instruction">উপরের বাটন থেকে যেকোনো PDF বা ছবি আপলোড করুন</p>
                </div>
            </div>
        </div>
        
        <div id="toolbar">
            <button onclick="deleteSeal(this)"><i class="fas fa-trash"></i></button>
            <div class="tb-sep"></div>
            <button onclick="duplicateSeal(this)"><i class="fas fa-copy"></i></button>
            <div class="tb-sep"></div>
            <button onclick="rotateSeal(this, -15)"><i class="fas fa-undo"></i></button>
            <button onclick="rotateSeal(this, 15)"><i class="fas fa-redo"></i></button>
            <div class="tb-sep"></div>
            <button onclick="resizeSeal(this, -10)"><i class="fas fa-minus"></i></button>
            <button onclick="resizeSeal(this, 10)"><i class="fas fa-plus"></i></button>
            <div class="tb-sep"></div>
            <input type="range" id="opacity-slider" min="10" max="100" value="100" oninput="changeOpacity(this)">
        </div>
    </div>

    <div id="bottom-actions">
        <button id="export-btn" onclick="toggleExportMenu()"><i class="fas fa-download"></i> <span id="export-text">ডাউনলোড</span></button>
    </div>
    <div id="export-options">
        <button onclick="downloadHDImage('png')"><i class="fas fa-image"></i> <span id="opt-png">HD PNG</span></button>
        <button onclick="downloadHDImage('jpeg')"><i class="fas fa-file-image"></i> <span id="opt-jpeg">HD JPEG</span></button>
        <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> <span id="opt-pdf">PDF ডাউনলোড</span></button>
        <button onclick="printPage()"><i class="fas fa-print"></i> <span id="opt-print">প্রিন্ট</span></button>
    </div>

    <div id="footer"><span id="footer-text">এটি একটি সিল মারার প্রফেশনাল ওয়েবসাইট</span></div>
    <div id="toast"><i class="fas fa-check-circle"></i> <span id="toast-message"></span></div>
    <div id="loader"><i class="fas fa-circle-notch"></i></div>

    <script>
        let currentPDF = null, currentLang = 'bn', toastTimeout;
        let currentZoom = 1.0;
        let currentPageNumber = 1;
        let totalPages = 1;

        const translations = {
            bn: {
                title: "প্রফেশনাল সিল অ্যাপ", sidebar: "সিল লাইব্রেরি", quick_upload: "যেকোনো ডকুমেন্ট আপলোড করুন",
                placeholder: "ডকুমেন্ট আপলোড করুন", instruction: "উপরের বাটন থেকে যেকোনো PDF বা ছবি আপলোড করুন",
                side_upload: "আপলোড", side_download: "ডাউনলোড", side_reload: "রিলোড", export: "ডাউনলোড",
                png: "HD PNG", jpeg: "HD JPEG", pdf: "PDF ডাউনলোড", print: "প্রিন্ট",
                footer: "এটি একটি সিল মারার প্রফেশনাল ওয়েবসাইট",
                toast_upload: "ফাইল সফলভাবে আপলোড হয়েছে!", toast_error: "PDF লোড করা যায়নি!",
                toast_seal: "সিল যোগ হয়েছে!", toast_delete: "সিল মুছে ফেলা হয়েছে!",
                toast_download: "ডাউনলোড সম্পন্ন!", toast_print: "প্রিন্ট হচ্ছে!"
            },
            en: {
                title: "Professional Seal App", sidebar: "Seal Library", quick_upload: "Upload any document",
                placeholder: "Upload your document", instruction: "Upload any PDF or Image from the top button",
                side_upload: "Upload", side_download: "Download", side_reload: "Reload", export: "Download",
                png: "HD PNG", jpeg: "HD JPEG", pdf: "Download PDF", print: "Print",
                footer: "This is a professional seal stamping website",
                toast_upload: "File uploaded successfully!", toast_error: "Unable to load PDF!",
                toast_seal: "Seal added!", toast_delete: "Seal deleted!",
                toast_download: "Download completed!", toast_print: "Printing!"
            }
        };

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.className = type;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            const tr = translations[currentLang];
            document.getElementById('title-text').innerText = tr.title;
            document.getElementById('sidebar-title').innerText = tr.sidebar;
            document.getElementById('quick-upload-text').innerText = tr.quick_upload;
            document.getElementById('doc-placeholder').innerText = tr.placeholder;
            document.getElementById('doc-instruction').innerText = tr.instruction;
            document.getElementById('side-upload-text').innerText = tr.side_upload;
            document.getElementById('side-download-text').innerText = tr.side_download;
            document.getElementById('side-reload-text').innerText = tr.side_reload;
            document.getElementById('export-text').innerText = tr.export;
            document.getElementById('opt-png').innerText = tr.png;
            document.getElementById('opt-jpeg').innerText = tr.jpeg;
            document.getElementById('opt-pdf').innerText = tr.pdf;
            document.getElementById('opt-print').innerText = tr.print;
            document.getElementById('footer-text').innerText = tr.footer;
            document.getElementById('lang-btn').innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
            buildMenu();
        }

        function toggleSidebar(show) { document.getElementById('sidebar').classList.toggle('open', show); document.getElementById('overlay').classList.toggle('show', show); }
        function toggleExportMenu() { document.getElementById('export-options').classList.toggle('show'); }
        
        function triggerSidebarUpload() {
            toggleSidebar(false);
            document.getElementById('file-upload').click();
        }

        // Search Filter Function
        function filterMenu() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const allItems = document.querySelectorAll('#menu-tree .seal-item');
            const allButtons = document.querySelectorAll('#menu-tree .level-btn');
            
            allItems.forEach(item => {
                const img = item.querySelector('img');
                const src = img ? img.src.toLowerCase() : '';
                item.style.display = (!query || src.includes(query)) ? 'flex' : 'none';
            });
            
            allButtons.forEach(btn => {
                btn.style.display = 'block';
            });
        }

        document.addEventListener('click', (e) => { if(!e.target.closest('#export-options') && !e.target.closest('#export-btn')) document.getElementById('export-options').classList.remove('show'); });

        function buildMenu() {
            const tree = document.getElementById('menu-tree'); tree.innerHTML = '';
            sealData.forEach((root, rIdx) => {
                const div = document.createElement('div');
                const rootName = currentLang === 'bn' ? root.name_bn : root.name_en;
                div.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span><i class="${root.icon}" style="margin-right:10px;"></i>${rootName}</span><i class="fas fa-chevron-right"></i></button>`;
                const nested = document.createElement('div'); nested.className = 'nested-container';
                if (root.subfolders) {
                    root.subfolders.forEach(sub => {
                        const subDiv = document.createElement('div');
                        const subName = currentLang === 'bn' ? sub.name_bn : sub.name_en;
                        subDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span style="font-size:13px;"><i class="${sub.icon}" style="margin-right:8px;"></i>${subName}</span><i class="fas fa-chevron-right"></i></button>`;
                        const subNested = document.createElement('div'); subNested.className = 'nested-container';
                        if (sub.subfolders) {
                            sub.subfolders.forEach(user => {
                                const uDiv = document.createElement('div');
                                const userName = currentLang === 'bn' ? user.name_bn : user.name_en;
                                uDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span style="font-size:12px;"><i class="${user.icon}" style="margin-right:8px;"></i>${userName}</span><i class="fas fa-chevron-right"></i></button>`;
                                const imgC = document.createElement('div'); imgC.className = 'images-container';
                                user.images.forEach(src => {
                                    const item = document.createElement('div'); item.className = 'seal-item'; item.onclick = () => addSeal(src);
                                    item.innerHTML = `<img src="${src}" onerror="this.src='https://placehold.co/100x100/png?text=Seal'">`;
                                    imgC.appendChild(item);
                                });
                                uDiv.appendChild(imgC); subNested.appendChild(uDiv);
                            });
                        } else if (sub.images) {
                            const imgC = document.createElement('div'); imgC.className = 'images-container';
                            sub.images.forEach(src => { const item = document.createElement('div'); item.className = 'seal-item'; item.onclick = () => addSeal(src); item.innerHTML = `<img src="${src}" onerror="this.src='https://placehold.co/100x100/png?text=Seal'">`; imgC.appendChild(item); });
                            subDiv.appendChild(imgC);
                        }
                        subDiv.appendChild(subNested); nested.appendChild(subDiv);
                    });
                }
                div.appendChild(nested); tree.appendChild(div);
            });
        }

        function toggleLevel(btn) { btn.classList.toggle('active'); btn.nextElementSibling.classList.toggle('show'); }

        // Upload & Render
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            document.getElementById('loader').style.display = 'block';

            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const container = document.getElementById('content-layer');
                container.innerHTML = '';
                
                if (file.type === 'application/pdf') {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    loadingTask.promise.then(function(pdf) {
                        currentPDF = pdf;
                        totalPages = pdf.numPages;
                        currentPageNumber = 1;
                        document.getElementById('pdf-controls').style.display = 'flex';
                        document.getElementById('page-count-display').innerText = `/ ${totalPages}`;
                        document.getElementById('page-jump').max = totalPages;
                        document.getElementById('page-jump').value = 1;
                        
                        for (let i = 1; i <= pdf.numPages; i++) {
                            pdf.getPage(i).then(function(page) {
                                const viewport = page.getViewport({ scale: 1.5 });
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                canvas.width = viewport.width;
                                canvas.height = viewport.height;

                                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                                    const pageDiv = document.createElement('div');
                                    pageDiv.className = 'a4-page';
                                    canvas.style.width = '100%';
                                    canvas.style.height = '100%';
                                    canvas.style.objectFit = 'contain';
                                    pageDiv.appendChild(canvas);
                                    container.appendChild(pageDiv);
                                });
                            });
                        }
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_upload, 'success');
                    }).catch(function(err) {
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_error, 'error');
                    });
                } 
                else if (file.type.startsWith('image/')) {
                    currentPDF = null;
                    document.getElementById('pdf-controls').style.display = 'none';
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.onload = function() {
                        const pageDiv = document.createElement('div'); pageDiv.className = 'a4-page';
                        img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'contain';
                        pageDiv.appendChild(img); container.appendChild(pageDiv);
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_upload, 'success');
                    };
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function nextPage() {
            if (currentPageNumber < totalPages) {
                const pages = document.querySelectorAll('.a4-page');
                if (pages[currentPageNumber]) {
                    pages[currentPageNumber - 1].style.display = 'none';
                    pages[currentPageNumber].style.display = 'block';
                    currentPageNumber++;
                    document.getElementById('page-jump').value = currentPageNumber;
                    document.getElementById('prev-btn').disabled = false;
                    if (currentPageNumber === totalPages) document.getElementById('next-btn').disabled = true;
                }
            }
        }

        function prevPage() {
            if (currentPageNumber > 1) {
                const pages = document.querySelectorAll('.a4-page');
                if (pages[currentPageNumber - 2]) {
                    pages[currentPageNumber - 1].style.display = 'none';
                    pages[currentPageNumber - 2].style.display = 'block';
                    currentPageNumber--;
                    document.getElementById('page-jump').value = currentPageNumber;
                    document.getElementById('next-btn').disabled = false;
                    if (currentPageNumber === 1) document.getElementById('prev-btn').disabled = true;
                }
            }
        }

        function jumpToPage() {
            let val = parseInt(document.getElementById('page-jump').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > totalPages) val = totalPages;
            
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach((page, idx) => {
                page.style.display = (idx === val - 1) ? 'block' : 'none';
            });
            
            currentPageNumber = val;
            document.getElementById('page-jump').value = val;
            document.getElementById('prev-btn').disabled = (val === 1);
            document.getElementById('next-btn').disabled = (val === totalPages);
        }

        function changeZoom(delta) {
            currentZoom = Math.max(0.5, Math.min(2.0, currentZoom + delta));
            document.getElementById('zoom-value').innerText = Math.round(currentZoom * 100) + '%';
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach(page => {
                page.style.transform = `scale(${currentZoom})`;
                page.style.transformOrigin = 'top center';
                page.style.marginBottom = `${20 * currentZoom}px`;
            });
        }

        // Seal Management (Advanced: Duplicate, Preset, etc.)
        function addSeal(src) {
            toggleSidebar(false);
            const container = document.getElementById('content-layer');
            const pages = container.querySelectorAll('.a4-page');
            let targetPage = pages[pages.length - 1];
            if (!targetPage) {
                const newPage = document.createElement('div'); newPage.className = 'a4-page'; newPage.style.position = 'relative';
                container.appendChild(newPage); targetPage = newPage;
            }

            const wrap = document.createElement('div'); 
            wrap.className = 'seal-wrapper normal-state'; 
            wrap.style.width = '150px'; wrap.style.height = '150px';
            
            wrap.innerHTML = `
                <img src="${src}" class="seal-img">
                <div class="handle move-handle" onmousedown="startDrag(event, this.parentElement)" ontouchstart="startDrag(event, this.parentElement)"><i class="fas fa-arrows-alt"></i></div>
                <div class="handle resize-handle" onmousedown="startResize(event, this.parentElement)" ontouchstart="startResize(event, this.parentElement)"><i class="fas fa-expand"></i></div>
                <div class="handle rotate-handle" onmousedown="startRotate(event, this.parentElement)" ontouchstart="startRotate(event, this.parentElement)"><i class="fas fa-sync-alt"></i></div>
                <div class="handle delete-handle" onclick="deleteSeal(this)"><i class="fas fa-trash"></i></div>
            `;

            wrap.onclick = function(e) { e.stopPropagation(); activateSeal(wrap); };
            wrap.ontouchstart = function(e) { e.stopPropagation(); activateSeal(wrap); };

            targetPage.appendChild(wrap); 
            showToast(translations[currentLang].toast_seal, 'success');
        }

        function activateSeal(el) {
            document.querySelectorAll('.seal-wrapper').forEach(w => { w.classList.remove('active-state'); w.classList.add('normal-state'); });
            el.classList.remove('normal-state'); el.classList.add('active-state');
            
            const tb = document.getElementById('toolbar'); 
            tb.style.display = 'flex';
            const r = el.getBoundingClientRect(); 
            const pr = el.parentElement.getBoundingClientRect();
            tb.style.left = (r.left - pr.left + r.width/2)+'px'; 
            tb.style.top = (r.top - pr.top)+'px';
            if(window.innerWidth < 600) { tb.style.left='50%'; tb.style.top='10px'; }
        }

        function duplicateSeal(btn) {
            const activeWrap = document.querySelector('.seal-wrapper.active-state');
            if (!activeWrap) return;
            
            const newWrap = activeWrap.cloneNode(true);
            newWrap.classList.remove('active-state');
            newWrap.classList.add('normal-state');
            newWrap.style.left = (parseFloat(activeWrap.style.left) + 20) + 'px';
            newWrap.style.top = (parseFloat(activeWrap.style.top) + 20) + 'px';
            newWrap.onclick = function(e) { e.stopPropagation(); activateSeal(newWrap); };
            newWrap.ontouchstart = function(e) { e.stopPropagation(); activateSeal(newWrap); };
            activeWrap.parentElement.appendChild(newWrap);
            
            showToast(translations[currentLang].toast_seal, 'success');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.seal-wrapper') && !e.target.closest('#toolbar')) {
                document.querySelectorAll('.seal-wrapper').forEach(w => { w.classList.remove('active-state'); w.classList.add('normal-state'); });
                document.getElementById('toolbar').style.display = 'none';
            }
        });

        document.addEventListener('touchstart', function(e) {
            if (!e.target.closest('.seal-wrapper') && !e.target.closest('#toolbar')) {
                document.querySelectorAll('.seal-wrapper').forEach(w => { w.classList.remove('active-state'); w.classList.add('normal-state'); });
                document.getElementById('toolbar').style.display = 'none';
            }
        });

        function startDrag(e, wrap) {
            e.preventDefault(); e.stopPropagation();
            const pr = wrap.parentElement.getBoundingClientRect();
            const sx = e.clientX || (e.touches && e.touches[0].clientX);
            const sy = e.clientY || (e.touches && e.touches[0].clientY);
            const ol = wrap.offsetLeft, ot = wrap.offsetTop;
            
            function move(ev) {
                const cx = ev.clientX || (ev.touches && ev.touches[0].clientX);
                const cy = ev.clientY || (ev.touches && ev.touches[0].clientY);
                let nl = ol + (cx - sx), nt = ot + (cy - sy);
                
                if(nl < 0) nl = 0; 
                if(nt < 0) nt = 0;
                if(nl + wrap.offsetWidth > pr.width) nl = pr.width - wrap.offsetWidth;
                if(nt + wrap.offsetHeight > pr.height) nt = pr.height - wrap.offsetHeight;
                
                wrap.style.left = nl+'px'; 
                wrap.style.top = nt+'px';
            }
            function up() { 
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); 
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); 
            }
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up, { passive: false });
        }

        function startResize(e, wrap) {
            e.preventDefault(); e.stopPropagation();
            const sx = e.clientX || (e.touches && e.touches[0].clientX);
            const sy = e.clientY || (e.touches && e.touches[0].clientY);
            const sw = wrap.offsetWidth, sh = wrap.offsetHeight;

            function move(ev) {
                const cx = ev.clientX || (ev.touches && ev.touches[0].clientX);
                const cy = ev.clientY || (ev.touches && ev.touches[0].clientY);
                const nw = sw + (cx - sx), nh = sh + (cy - sy);
                if(nw > 50 && nh > 50) { wrap.style.width = nw+'px'; wrap.style.height = nh+'px'; }
            }
            function up() { 
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); 
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); 
            }
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up, { passive: false });
        }

        function startRotate(e, wrap) {
            e.preventDefault(); e.stopPropagation();
            const sx = e.clientX || (e.touches && e.touches[0].clientX);
            const sy = e.clientY || (e.touches && e.touches[0].clientY);
            const img = wrap.querySelector('.seal-img');
            const startRot = img.style.transform ? parseFloat(img.style.transform.replace('rotate(','').replace(')','')) : 0;

            function move(ev) {
                const cx = ev.clientX || (ev.touches && ev.touches[0].clientX);
                const cy = ev.clientY || (ev.touches && ev.touches[0].clientY);
                const angle = Math.atan2(cy - sy, cx - sx) * (180 / Math.PI);
                img.style.transform = `rotate(${startRot + angle}deg)`;
            }
            function up() { 
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); 
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); 
            }
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', up, { passive: false });
        }

        function deleteSeal(btn) {
            const wrap = btn.parentElement;
            wrap.remove();
            document.getElementById('toolbar').style.display = 'none';
            showToast(translations[currentLang].toast_delete, 'success');
        }

        function rotateSeal(btn, v) {
            if (!document.querySelector('.seal-wrapper.active-state')) return;
            const img = document.querySelector('.seal-wrapper.active-state .seal-img');
            const cr = img.style.transform ? parseFloat(img.style.transform.replace('rotate(','')) : 0;
            img.style.transform = `rotate(${cr+v}deg)`;
        }

        function resizeSeal(btn, v) {
            if (!document.querySelector('.seal-wrapper.active-state')) return;
            const wrap = document.querySelector('.seal-wrapper.active-state');
            const w = wrap.offsetWidth+v, h = wrap.offsetHeight+v;
            if(w>50 && h>50) { wrap.style.width=w+'px'; wrap.style.height=h+'px'; }
        }

        function changeOpacity(inp) {
            if (!document.querySelector('.seal-wrapper.active-state')) return;
            const wrap = document.querySelector('.seal-wrapper.active-state');
            wrap.style.opacity = inp.value/100;
        }

        // 4K Downloads & ALL Pages Print
        async function downloadHDImage(format) {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => { w.classList.remove('active-state'); w.classList.add('normal-state'); });
            
            const pages = document.querySelectorAll('.a4-page');
            if (pages.length === 0) return;
            
            document.getElementById('loader').style.display = 'block';
            
            for (let i = 0; i < pages.length; i++) {
                const canvas = await html2canvas(pages[i], { scale: 4, useCORS: true });
                const link = document.createElement('a');
                link.download = `document-page-${i+1}.${format}`;
                link.href = canvas.toDataURL(format === 'jpeg' ? 'image/jpeg' : 'image/png');
                link.click();
            }
            
            document.getElementById('loader').style.display = 'none';
            showToast(translations[currentLang].toast_download, 'success');
        }

        async function downloadPDF() {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => { w.classList.remove('active-state'); w.classList.add('normal-state'); });
            
            const pages = document.querySelectorAll('.a4-page');
            if (pages.length === 0) return;
            
            document.getElementById('loader').style.display = 'block';
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            for (let i = 0; i < pages.length; i++) {
                const canvas = await html2canvas(pages[i], { scale: 3, useCORS: true });
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
            }
            
            pdf.save('document.pdf');
            document.getElementById('loader').style.display = 'none';
            showToast(translations[currentLang].toast_download, 'success');
        }

        function printPage() {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => { w.classList.remove('active-state'); w.classList.add('normal-state'); });
            showToast(translations[currentLang].toast_print, 'success');
            setTimeout(() => { window.print(); }, 500);
        }

        window.onload = buildMenu;
    </script>
</body>
