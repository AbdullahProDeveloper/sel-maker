            position: relative;
        }
        .quick-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(79,70,229,0.6); }
        .quick-btn:active { transform: scale(0.9); }
        .quick-btn-label {
            position: absolute;
            right: 60px;
            background: rgba(15,23,42,0.95);
            color: white;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: var(--shadow-md);
        }
        .quick-btn:hover .quick-btn-label { opacity: 1; }

        /* ===== ডাউনলোড বাটন ===== */
        #bottom-actions {
            position: fixed;
            bottom: 20px;
            right: 15px;
            z-index: 95;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #export-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            padding: 14px 22px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(79,70,229,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        #export-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(79,70,229,0.7); }
        #export-btn:active { transform: scale(0.95); }
        #export-options {
            position: fixed;
            bottom: 85px;
            right: 15px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: var(--radius-xl);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 5px;
            z-index: 300;
            min-width: 200px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.12);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }
        #export-options.show { display: flex; opacity: 1; transform: translateY(0); }
        #export-options button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            text-align: left;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            font-size: 12px;
            font-weight: 600;
        }
        #export-options button:hover { background: rgba(79,70,229,0.3); border-color: var(--primary); transform: translateX(4px); }
        #export-options button i { font-size: 15px; width: 20px; text-align: center; }

        /* ===== টোস্ট ===== */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
            backdrop-filter: blur(10px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { border-left: 4px solid var(--secondary); }
        #toast.error { border-left: 4px solid var(--danger); }
        #toast.info { border-left: 4px solid var(--primary); }
        #toast i { font-size: 18px; }

        /* ===== লোডার ===== */
        #loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,23,42,0.95);
            padding: 30px;
            border-radius: 50%;
            z-index: 500;
            color: var(--primary-light);
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }
        #loader i { font-size: 40px; animation: spin 1.2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ===== মোবাইল রেসপন্সিভ ===== */
        @media (max-width: 768px) {
            #header { height: 55px; padding: 0 10px; }
            .brand-icon { width: 34px; height: 34px; font-size: 17px; }
            .brand-title { font-size: 13px; }
            .brand-subtitle { font-size: 7px; }
            .header-btn { padding: 6px 10px; font-size: 9px; }
            #quick-upload { padding: 8px 10px; }
            .upload-btn { padding: 11px 16px; font-size: 12px; }
            #controls-bar { padding: 5px 6px; gap: 4px; }
            #controls-bar button { padding: 4px 7px; font-size: 8px; }
            #controls-bar input { width: 35px; padding: 3px; font-size: 8px; }
            #scroll-area { padding: 8px; padding-top: 50px; }
            #seal-editor { padding: 8px 10px; gap: 4px; bottom: 10px; }
            .editor-btn { width: 34px; height: 34px; font-size: 13px; border-radius: 8px; }
            .editor-section { padding: 2px 5px; }
            .editor-label { font-size: 7px; }
            input[type="range"].editor-input { width: 45px; }
            #quick-seal-buttons { left: 8px; bottom: 10px; }
            .quick-btn { width: 42px; height: 42px; font-size: 15px; }
            #bottom-actions { right: 8px; bottom: 10px; }
            #export-btn { padding: 11px 16px; font-size: 11px; }
            #export-options { bottom: 70px; right: 8px; min-width: 180px; }
            .editor-preview-mini { width: 30px; height: 30px; }
        }
        @media (max-width: 400px) {
            .brand-subtitle { display: none; }
            .header-btn span { display: none; }
            .header-btn { padding: 7px; }
            .header-btn i { font-size: 15px; }
            .editor-btn { width: 30px; height: 30px; font-size: 11px; }
            input[type="range"].editor-input { width: 35px; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="header-left">
            <button class="header-btn" onclick="toggleSidebar(true)" title="মেনু">
                <i class="fas fa-bars"></i>
            </button>
            <div class="brand-icon"><i class="fas fa-stamp"></i></div>
            <div>
                <div class="brand-title" id="title-text">নোটারি সিল অ্যাপ</div>
                <div class="brand-subtitle">Professional Studio</div>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="toggleLanguage()" title="ভাষা">
                <i class="fas fa-globe"></i> <span id="lang-text">EN</span>
            </button>
            <button class="header-btn" onclick="showHelp()" title="সাহায্য">
                <i class="fas fa-question-circle"></i>
            </button>
        </div>
    </header>

    <div id="quick-upload">
        <label for="file-upload" class="upload-btn">
            <i class="fas fa-cloud-upload-alt"></i>
            <span id="quick-upload-text">ডকুমেন্ট আপলোড করুন</span>
        </label>
        <input id="file-upload" type="file" accept="application/pdf,image/*" onchange="handleFileUpload(event)">
    </div>

    <div id="sidebar">
        <div class="side-header">
            <h3><i class="fas fa-folder-tree"></i> <span id="sidebar-title">সিল লাইব্রেরি</span></h3>
            <button id="close-btn" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        <div id="sidebar-actions">
            <button class="side-action-btn" onclick="triggerSidebarUpload()"><i class="fas fa-cloud-upload-alt"></i> আপলোড</button>
            <button class="side-action-btn" onclick="downloadHDImage('png')"><i class="fas fa-download"></i> ডাউনলোড</button>
            <button class="side-action-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> রিফ্রেশ</button>
        </div>
        <div id="search-container">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="সিল খুঁজুন..." oninput="advancedSearch()">
                <button id="search-clear" onclick="clearSearch()"><i class="fas fa-times"></i></button>
            </div>
            <span id="search-status"></span>
        </div>
        <div id="menu-tree"></div>
    </div>
    <div id="overlay" onclick="toggleSidebar(false)"></div>

    <div id="main-area">
        <div id="controls-bar" style="display:none;">
            <button id="prev-btn" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
            <input type="number" id="page-jump" min="1" value="1" onchange="jumpToPage()">
            <span id="page-count-display">/ 1</span>
            <button id="next-btn" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
            <div style="width:1px;height:20px;background:var(--border);margin:0 4px;"></div>
            <button onclick="changeZoom(-0.1)" title="জুম আউট"><i class="fas fa-minus"></i></button>
            <span id="zoom-value" style="font-size:10px;font-weight:bold;">100%</span>
            <button onclick="changeZoom(0.1)" title="জুম ইন"><i class="fas fa-plus"></i></button>
            <div style="width:1px;height:20px;background:var(--border);margin:0 4px;"></div>
            <button id="download-current-btn" onclick="downloadCurrentPage()" title="বর্তমান পেজ ডাউনলোড"><i class="fas fa-download"></i> ডাউনলোড</button>
        </div>
        <div id="scroll-area">
            <div id="content-layer">
                <div class="empty-state">
                    <i class="fas fa-file-upload"></i>
                    <h3 id="doc-placeholder">ডকুমেন্ট আপলোড করুন</h3>
                    <p id="doc-instruction">উপরের বাটনে ক্লিক করে PDF বা ছবি আপলোড করুন</p>
                </div>
            </div>
        </div>
    </div>

    <!-- কমপ্যাক্ট সিল এডিটর -->
    <div id="seal-editor">
        <div class="editor-preview-mini"><img id="mini-preview" src="" alt="preview"></div>
        <button class="editor-btn" onclick="moveSeal(0,-20)" title="উপরে"><i class="fas fa-arrow-up"></i><span class="tooltip">উপরে</span></button>
        <button class="editor-btn" onclick="moveSeal(-20,0)" title="বামে"><i class="fas fa-arrow-left"></i><span class="tooltip">বামে</span></button>
        <button class="editor-btn" onclick="centerSeal()" title="কেন্দ্র"><i class="fas fa-crosshairs"></i><span class="tooltip">কেন্দ্র</span></button>
        <button class="editor-btn" onclick="moveSeal(20,0)" title="ডানে"><i class="fas fa-arrow-right"></i><span class="tooltip">ডানে</span></button>
        <button class="editor-btn" onclick="moveSeal(0,20)" title="নিচে"><i class="fas fa-arrow-down"></i><span class="tooltip">নিচে</span></button>
        <div class="editor-section">
            <span class="editor-label">ছোট</span>
            <input type="range" class="editor-input" id="editor-size" min="50" max="200" value="120" oninput="editorSizeChange(this.value)">
            <span class="editor-label">বড়</span>
        </div>
        <button class="editor-btn" onclick="rotateSeal(-15)" title="বামে ঘুরান"><i class="fas fa-undo"></i><span class="tooltip">বামে ঘুরান</span></button>
        <button class="editor-btn" onclick="resetRotation()" title="রিসেট"><i class="fas fa-undo-alt"></i><span class="tooltip">রিসেট</span></button>
        <button class="editor-btn" onclick="rotateSeal(15)" title="ডানে ঘুরান"><i class="fas fa-redo"></i><span class="tooltip">ডানে ঘুরান</span></button>
        <div class="editor-section">
            <span class="editor-label">১০%</span>
            <input type="range" class="editor-input" id="editor-opacity" min="10" max="100" value="100" oninput="editorOpacityChange(this.value)">
            <span class="editor-label">১০০%</span>
        </div>
        <button class="editor-btn" onclick="duplicateSeal()" title="কপি"><i class="fas fa-copy"></i><span class="tooltip">কপি</span></button>
        <button class="editor-btn danger" onclick="deleteSeal()" title="মুছুন"><i class="fas fa-trash"></i><span class="tooltip">মুছুন</span></button>
        <button class="editor-btn success" onclick="closeSealEditor()" title="বন্ধ করুন"><i class="fas fa-check"></i><span class="tooltip">বন্ধ</span></button>
    </div>

    <div id="quick-seal-buttons">
        <button class="quick-btn" onclick="showRecentSeals()" title="সম্প্রতি"><span class="quick-btn-label">সম্প্রতি</span><i class="fas fa-clock"></i></button>
        <button class="quick-btn" onclick="toggleSidebar(true)" title="লাইব্রেরি"><span class="quick-btn-label">লাইব্রেরি</span><i class="fas fa-th"></i></button>
    </div>

    <div id="bottom-actions">
        <button id="export-btn" onclick="toggleExportMenu()"><i class="fas fa-download"></i> <span id="export-text">ডাউনলোড</span></button>
    </div>

    <div id="export-options">
        <button onclick="downloadHDImage('png')"><i class="fas fa-image"></i> HD PNG</button>
        <button onclick="downloadHDImage('jpeg')"><i class="fas fa-file-image"></i> HD JPEG</button>
        <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF ডাউনলোড</button>
        <button onclick="printPage()"><i class="fas fa-print"></i> প্রিন্ট</button>
    </div>

    <div id="toast"><i class="fas fa-check-circle"></i> <span id="toast-message"></span></div>
    <div id="loader"><i class="fas fa-circle-notch"></i></div>

    <script>
        // ===== স্টেট =====
        let currentPDF = null;
        let currentLang = 'bn';
        let toastTimeout;
        let currentZoom = 1.0;
        let currentPageNumber = 1;
        let totalPages = 1;
        let currentPageElement = null;
        let recentSeals = [];
        let activeSeal = null;
        let currentSealSrc = null;
        let allPages = [];

        // ===== অনুবাদ =====
        const translations = {
            bn: {
                title: "নোটারি সিল অ্যাপ", sidebar: "সিল লাইব্রেরি", quick_upload: "ডকুমেন্ট আপলোড করুন",
                placeholder: "ডকুমেন্ট আপলোড করুন", instruction: "উপরের বাটনে ক্লিক করে PDF বা ছবি আপলোড করুন",
                export: "ডাউনলোড", toast_upload: "✓ ফাইল সফলভাবে আপলোড হয়েছে!", toast_error: "✗ PDF লোড করতে ব্যর্থ হয়েছে!",
                toast_seal: "✓ সিল যোগ করা হয়েছে!", toast_delete: "✓ সিল মুছে ফেলা হয়েছে!", toast_download: "✓ ডাউনলোড সম্পন্ন হয়েছে!",
                toast_print: "✓ প্রিন্ট করা হচ্ছে...", no_seal_error: "আগে সিল দিন তারপর ডাউনলোড করুন!",
                help: "১. ডকুমেন্ট আপলোড করুন\n২. বাম মেনু থেকে সিল বাছুন\n৩. সিলে ট্যাপ করে এডিটর খুলুন\n৪. সিল টেনে সরান\n৫. ডান বাটন থেকে ডাউনলোড করুন"
            },
            en: {
                title: "Notary Seal App", sidebar: "Seal Library", quick_upload: "Upload Document",
                placeholder: "Upload your document", instruction: "Click above to upload PDF or image",
                export: "Download", toast_upload: "✓ File uploaded!", toast_error: "✗ Failed to load PDF!",
                toast_seal: "✓ Seal added!", toast_delete: "✓ Seal deleted!", toast_download: "✓ Download completed!",
                toast_print: "✓ Printing...", no_seal_error: "Add a seal first then download!",
                help: "1. Upload document\n2. Pick a seal from left menu\n3. Tap seal to open editor\n4. Drag seal to move\n5. Download from right button"
            }
        };

        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.className = type;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            const tr = translations[currentLang];
            document.getElementById('title-text').innerText = tr.title;
            document.getElementById('sidebar-title').innerText = tr.sidebar;
            document.getElementById('quick-upload-text').innerText = tr.quick_upload;
            document.getElementById('doc-placeholder').innerText = tr.placeholder;
            document.getElementById('doc-instruction').innerText = tr.instruction;
            document.getElementById('export-text').innerText = tr.export;
            document.getElementById('lang-text').innerText = currentLang === 'bn' ? 'EN' : 'বাং';
            document.getElementById('search-input').placeholder = currentLang === 'bn' ? 'সিল খুঁজুন...' : 'Search seals...';
            buildMenu();
        }

        function showHelp() { showToast(translations[currentLang].help, 'info'); }

        function toggleSidebar(show) {
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('overlay').classList.toggle('show', show);
        }
        function toggleExportMenu() {
            document.getElementById('export-options').classList.toggle('show');
            document.getElementById('seal-editor').classList.remove('show');
        }
        function triggerSidebarUpload() { toggleSidebar(false); document.getElementById('file-upload').click(); }
        function showRecentSeals() { if(recentSeals.length===0) showToast('কোন সাম্প্রতিক সিল নেই', 'info'); else { toggleSidebar(true); showToast('সম্প্রতি ব্যবহৃত সিলগুলো দেখুন', 'info'); } }

        function advancedSearch() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            document.getElementById('search-clear').classList.toggle('visible', !!q);
            const items = document.querySelectorAll('.seal-item');
            let count = 0;
            items.forEach(item => {
                const match = !q || item.querySelector('img')?.src?.toLowerCase().includes(q);
                item.style.display = match ? 'flex' : 'none';
                if(match && q) count++;
            });
            document.getElementById('search-status').innerText = q ? `${count} টি সিল পাওয়া গেছে` : '';
            if(q) {
                document.querySelectorAll('.nested-container').forEach(n => n.classList.add('show'));
                document.querySelectorAll('.images-container').forEach(c => c.classList.add('show'));
            } else {
                document.querySelectorAll('.nested-container').forEach(n => n.classList.remove('show'));
                document.querySelectorAll('.images-container').forEach(c => c.classList.remove('show'));
            }
        }
        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear').classList.remove('visible');
            document.getElementById('search-status').innerText = '';
            document.querySelectorAll('.seal-item').forEach(i => i.style.display = 'flex');
            document.querySelectorAll('.nested-container').forEach(n => n.classList.remove('show'));
            document.querySelectorAll('.images-container').forEach(c => c.classList.remove('show'));
        }

        function buildMenu() {
            const tree = document.getElementById('menu-tree');
            tree.innerHTML = '';
            sealData.forEach(root => {
                const div = document.createElement('div');
                div.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span class="level-name"><i class="${root.icon}"></i>${currentLang==='bn'?root.name_bn:root.name_en}</span><i class="fas fa-chevron-right"></i></button>`;
                const nested = document.createElement('div'); nested.className = 'nested-container';
                root.subfolders?.forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span class="level-name"><i class="${sub.icon}"></i>${currentLang==='bn'?sub.name_bn:sub.name_en}</span><i class="fas fa-chevron-right"></i></button>`;
                    const subNested = document.createElement('div'); subNested.className = 'nested-container';
                    sub.subfolders?.forEach(subSub => {
                        const ssDiv = document.createElement('div');
                        ssDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span class="level-name"><i class="${subSub.icon}"></i>${currentLang==='bn'?subSub.name_bn:subSub.name_en}</span><i class="fas fa-chevron-right"></i></button>`;
                        const ssNested = document.createElement('div'); ssNested.className = 'nested-container';
                        const imgC = document.createElement('div'); imgC.className = 'images-container';
                        subSub.images?.forEach(src => {
                            const item = document.createElement('div'); item.className = 'seal-item'; item.onclick = () => addSeal(src);
                            item.innerHTML = `<img src="${src}" alt="seal" loading="lazy">`;
                            imgC.appendChild(item);
                        });
                        ssDiv.appendChild(imgC);
                        subNested.appendChild(ssDiv);
                    });
                    subDiv.appendChild(subNested);
                    nested.appendChild(subDiv);
                });
                div.appendChild(nested);
                tree.appendChild(div);
            });
        }
        function toggleLevel(btn) {
            btn.classList.toggle('active');
            btn.nextElementSibling.classList.toggle('show');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            document.getElementById('loader').style.display = 'block';
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const container = document.getElementById('content-layer');
                container.innerHTML = '';
                if(file.type === 'application/pdf') {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    pdfjsLib.getDocument({data: arrayBuffer}).promise.then(pdf => {
                        currentPDF = pdf;
                        totalPages = pdf.numPages;
                        currentPageNumber = 1;
                        document.getElementById('controls-bar').style.display = 'flex';
                        document.getElementById('page-count-display').innerText = `/ ${totalPages}`;
                        document.getElementById('page-jump').max = totalPages;
                        document.getElementById('page-jump').value = 1;
                        allPages = [];
                        for(let i = 1; i <= totalPages; i++) {
                            pdf.getPage(i).then(page => {
                                const viewport = page.getViewport({scale: 2});
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                canvas.width = viewport.width;
                                canvas.height = viewport.height;
                                page.render({canvasContext: ctx, viewport: viewport}).promise.then(() => {
                                    const pc = document.createElement('div');
                                    pc.className = 'page-container';
                                    pc.dataset.pageNum = i;
                                    const pd = document.createElement('div');
                                    pd.className = 'a4-page';
                                    if(i === 1) { pd.classList.add('current-page'); currentPageElement = pd; }
                                    pd.style.display = (i === 1) ? 'block' : 'none';
                                    canvas.style.width = '100%';
                                    canvas.style.height = '100%';
                                    canvas.style.objectFit = 'contain';
                                    pd.appendChild(canvas);
                                    pc.appendChild(pd);
                                    container.appendChild(pc);
                                    allPages.push(pd);
                                    if(allPages.length === totalPages) {
                                        document.getElementById('loader').style.display = 'none';
                                        showToast(translations[currentLang].toast_upload);
                                    }
                                });
                            });
                        }
                    }).catch(() => {
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_error, 'error');
                    });
                } else if(file.type.startsWith('image/')) {
                    currentPDF = null;
                    document.getElementById('controls-bar').style.display = 'none';
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.onload = function() {
                        const pc = document.createElement('div');
                        pc.className = 'page-container';
                        const pd = document.createElement('div');
                        pd.className = 'a4-page current-page';
                        currentPageElement = pd;
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'contain';
                        pd.appendChild(img);
                        pc.appendChild(pd);
                        container.appendChild(pc);
                        allPages = [pd];
                        document.getElementById('loader').style.display = 'none';
                        showToast(translations[currentLang].toast_upload);
                    };
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function nextPage() {
            if(currentPageNumber < totalPages) {
                const pages = document.querySelectorAll('.a4-page');
                pages.forEach(p => p.classList.remove('current-page'));
                pages[currentPageNumber].classList.add('current-page');
                currentPageElement = pages[currentPageNumber];
                pages[currentPageNumber - 1].style.display = 'none';
                pages[currentPageNumber].style.display = 'block';
                currentPageNumber++;
                document.getElementById('page-jump').value = currentPageNumber;
                document.getElementById('next-btn').disabled = (currentPageNumber === totalPages);
                document.getElementById('prev-btn').disabled = false;
                closeSealEditor();
            }
        }
        function prevPage() {
            if(currentPageNumber > 1) {
                const pages = document.querySelectorAll('.a4-page');
                pages.forEach(p => p.classList.remove('current-page'));
                pages[currentPageNumber - 2].classList.add('current-page');
                currentPageElement = pages[currentPageNumber - 2];
                pages[currentPageNumber - 1].style.display = 'none';
                pages[currentPageNumber - 2].style.display = 'block';
                currentPageNumber--;
                document.getElementById('page-jump').value = currentPageNumber;
                document.getElementById('prev-btn').disabled = (currentPageNumber === 1);
                document.getElementById('next-btn').disabled = false;
                closeSealEditor();
            }
        }
        function jumpToPage() {
            let v = parseInt(document.getElementById('page-jump').value) || 1;
            if(v > totalPages) v = totalPages;
            if(v < 1) v = 1;
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach((p, i) => {
                p.classList.remove('current-page');
                p.style.display = (i === v - 1) ? 'block' : 'none';
                if(i === v - 1) { p.classList.add('current-page'); currentPageElement = p; }
            });
            currentPageNumber = v;
            document.getElementById('prev-btn').disabled = (v === 1);
            document.getElementById('next-btn').disabled = (v === totalPages);
            closeSealEditor();
        }
        function changeZoom(d) {
            currentZoom = Math.max(0.5, Math.min(2.5, currentZoom + d));
            document.getElementById('zoom-value').innerText = Math.round(currentZoom * 100) + '%';
            document.querySelectorAll('.page-container').forEach(p => p.style.maxWidth = (794 * currentZoom) + 'px');
        }

        function addSeal(src) {
            if(!currentPageElement) {
                showToast('প্রথমে ডকুমেন্ট আপলোড করুন', 'error');
                return;
            }
            toggleSidebar(false);
            const wrap = document.createElement('div');
            wrap.className = 'seal-wrapper normal-state';
            wrap.style.width = '120px';
            wrap.style.height = '120px';
            wrap.style.left = '50%';
            wrap.style.top = '50%';
            wrap.style.transform = 'translate(-50%, -50%)';
            wrap.innerHTML = `<img src="${src}" class="seal-img" alt="seal">`;
            wrap.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                activateSeal(wrap);
                startTouchDrag(e, wrap);
            }, {passive: false});
            wrap.addEventListener('click', (e) => {
                e.stopPropagation();
                activateSeal(wrap);
                openSealEditor();
            });
            currentPageElement.appendChild(wrap);
            if(!recentSeals.includes(src)) {
                recentSeals.unshift(src);
                if(recentSeals.length > 5) recentSeals.pop();
            }
            showToast(translations[currentLang].toast_seal);
        }

        function startTouchDrag(e, wrap) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = wrap.parentElement.getBoundingClientRect();
            const pr = wrap.parentElement;
            let startX = touch.clientX - rect.left;
            let startY = touch.clientY - rect.top;
            let startLeft = wrap.offsetLeft;
            let startTop = wrap.offsetTop;
            function move(ev) {
                ev.preventDefault();
                const t = ev.touches[0];
                let x = t.clientX - rect.left;
                let y = t.clientY - rect.top;
                let nl = startLeft + (x - startX);
                let nt = startTop + (y - startY);
                nl = Math.max(0, Math.min(nl, pr.offsetWidth - wrap.offsetWidth));
                nt = Math.max(0, Math.min(nt, pr.offsetHeight - wrap.offsetHeight));
                wrap.style.left = nl + 'px';
                wrap.style.top = nt + 'px';
            }
            function up() {
                document.removeEventListener('touchmove', move);
                document.removeEventListener('touchend', up);
            }
            document.addEventListener('touchmove', move, {passive: false});
            document.addEventListener('touchend', up);
        }

        function activateSeal(el) {
            document.querySelectorAll('.seal-wrapper').forEach(w => w.classList.remove('active-state'));
            el.classList.add('active-state');
            activeSeal = el;
            currentSealSrc = el.querySelector('.seal-img').src;
            updateMiniPreview();
        }

        function openSealEditor() {
            const editor = document.getElementById('seal-editor');
            editor.classList.add('show');
            if(activeSeal) {
                const size = parseInt(activeSeal.style.width) || 120;
                document.getElementById('editor-size').value = size;
                const op = parseFloat(activeSeal.style.opacity || 1) * 100;
                document.getElementById('editor-opacity').value = op;
                updateMiniPreview();
            }
            document.getElementById('export-options').classList.remove('show');
        }

        function closeSealEditor() {
            document.getElementById('seal-editor').classList.remove('show');
            if(activeSeal) {
                activeSeal.classList.remove('active-state');
                activeSeal = null;
            }
        }

        function updateMiniPreview() {
            const preview = document.getElementById('mini-preview');
            if(activeSeal) {
                preview.src = activeSeal.querySelector('.seal-img').src;
                const img = activeSeal.querySelector('.seal-img');
                const rot = parseFloat(img.dataset.rotation || 0);
                preview.style.transform = `rotate(${rot}deg)`;
                preview.style.opacity = activeSeal.style.opacity || 1;
            }
        }

        function editorSizeChange(v) {
            if(activeSeal) {
                activeSeal.style.width = v + 'px';
                activeSeal.style.height = v + 'px';
                updateMiniPreview();
            }
        }
        function editorOpacityChange(v) {
            if(activeSeal) {
                activeSeal.style.opacity = v / 100;
                updateMiniPreview();
            }
        }
        function centerSeal() {
            if(activeSeal && currentPageElement) {
                activeSeal.style.left = '50%';
                activeSeal.style.top = '50%';
                activeSeal.style.transform = 'translate(-50%, -50%)';
            }
        }
        function moveSeal(dx, dy) {
            if(activeSeal) {
                activeSeal.style.left = (parseFloat(activeSeal.style.left) || 0) + dx + 'px';
                activeSeal.style.top = (parseFloat(activeSeal.style.top) || 0) + dy + 'px';
            }
        }
        function duplicateSeal() {
            if(!activeSeal) return;
            const src = activeSeal.querySelector('.seal-img').src;
            const newS = activeSeal.cloneNode(true);
            newS.style.left = (parseFloat(activeSeal.style.left) + 20) + 'px';
            newS.style.top = (parseFloat(activeSeal.style.top) + 20) + 'px';
            newS.classList.remove('active-state');
            newS.addEventListener('click', (e) => { e.stopPropagation(); activateSeal(newS); openSealEditor(); });
            newS.addEventListener('touchstart', (e) => { e.stopPropagation(); activateSeal(newS); startTouchDrag(e, newS); }, {passive: false});
            currentPageElement.appendChild(newS);
            showToast('✓ সিল ডুপ্লিকেট করা হয়েছে!');
        }
        function resetRotation() {
            if(activeSeal) {
                const img = activeSeal.querySelector('.seal-img');
                img.style.transform = 'rotate(0deg)';
                img.dataset.rotation = 0;
                updateMiniPreview();
            }
        }
        function rotateSeal(angle) {
            if(activeSeal) {
                const img = activeSeal.querySelector('.seal-img');
                const cur = parseFloat(img.dataset.rotation || 0);
                const nr = cur + angle;
                img.style.transform = `rotate(${nr}deg)`;
                img.dataset.rotation = nr;
                updateMiniPreview();
            }
        }
        function deleteSeal() {
            if(activeSeal) {
                activeSeal.remove();
                closeSealEditor();
                showToast(translations[currentLang].toast_delete);
            }
        }

        function hasSealOnCurrentPage() {
            return currentPageElement?.querySelectorAll('.seal-wrapper').length > 0;
        }

        async function downloadCurrentPage() {
            if(!hasSealOnCurrentPage()) {
                showToast(translations[currentLang].no_seal_error, 'error');
                return;
            }
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            const pc = currentPageElement?.closest('.page-container');
            if(!pc) return;
            document.getElementById('loader').style.display = 'block';
            try {
                const canvas = await html2canvas(pc, {scale: 3, useCORS: true});
                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `page-${currentPageNumber}.png`;
                link.href = imgData;
                link.click();
                document.getElementById('loader').style.display = 'none';
                showToast(translations[currentLang].toast_download);
            } catch(e) {
                document.getElementById('loader').style.display = 'none';
                showToast('✗ ' + e.message, 'error');
            }
        }

        async function downloadHDImage(format) {
            if(!document.querySelector('.seal-wrapper')) {
                showToast(translations[currentLang].no_seal_error, 'error');
                return;
            }
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => w.classList.remove('active-state'));
            const pcs = document.querySelectorAll('.page-container');
            if(!pcs.length) return;
            document.getElementById('loader').style.display = 'block';
            try {
                const zip = new JSZip();
                const folder = zip.folder('pages');
                for(let i = 0; i < pcs.length; i++) {
                    const canvas = await html2canvas(pcs[i], {scale: 3, useCORS: true});
                    const imgData = canvas.toDataURL(format === 'jpeg' ? 'image/jpeg' : 'image/png');
                    if(pcs.length === 1) {
                        const a = document.createElement('a');
                        a.download = `document.${format}`;
                        a.href = imgData;
                        a.click();
                    } else {
                        folder.file(`page-${i+1}.${format}`, imgData.split(',')[1], {base64: true});
                    }
                    await new Promise(r => setTimeout(r, 200));
                }
                if(pcs.length > 1) {
                    const blob = await zip.generateAsync({type: 'blob'});
                    const a = document.createElement('a');
                    a.download = 'document.zip';
                    a.href = URL.createObjectURL(blob);
                    a.click();
                }
                document.getElementById('loader').style.display = 'none';
                showToast(translations[currentLang].toast_download);
            } catch(e) {
                document.getElementById('loader').style.display = 'none';
                showToast('✗ ' + e.message, 'error');
            }
        }

        async function downloadPDF() {
            if(!document.querySelector('.seal-wrapper')) {
                showToast(translations[currentLang].no_seal_error, 'error');
                return;
            }
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            const pcs = document.querySelectorAll('.page-container');
            if(!pcs.length) return;
            document.getElementById('loader').style.display = 'block';
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                for(let i = 0; i < pcs.length; i++) {
                    const canvas = await html2canvas(pcs[i], {scale: 2, useCORS: true});
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    if(i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                    await new Promise(r => setTimeout(r, 200));
                }
                pdf.save('document.pdf');
                document.getElementById('loader').style.display = 'none';
                showToast(translations[currentLang].toast_download);
            } catch(e) {
                document.getElementById('loader').style.display = 'none';
                showToast('✗ ' + e.message, 'error');
            }
        }

        function printPage() {
            if(!document.querySelector('.seal-wrapper')) {
                showToast(translations[currentLang].no_seal_error, 'error');
                return;
            }
            closeSealEditor();
            document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w => w.classList.remove('active-state'));
            showToast(translations[currentLang].toast_print);
            setTimeout(() => window.print(), 300);
        }

        document.addEventListener('click', (e) => {
            if(!e.target.closest('#export-options') && !e.target.closest('#export-btn') && !e.target.closest('#seal-editor') && !e.target.closest('.seal-wrapper')) {
                document.getElementById('export-options').classList.remove('show');
                closeSealEditor();
            }
        });

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Delete' && activeSeal) deleteSeal();
            if(e.key === 'Escape') {
                toggleSidebar(false);
                document.getElementById('export-options').classList.remove('show');
                closeSealEditor();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            buildMenu();
        });
    </script>
</body>
</html>
