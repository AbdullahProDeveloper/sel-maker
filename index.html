<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Notary Stamp & Seal</title>
    
    <!-- Libraries -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="data.js"></script> <!-- আপনার ডেটা ফাইল -->

    <style>
        /* Modern CSS Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f1f5f9; }

        /* Header */
        #header { height: 65px; background: #0f172a; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #header h2 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
        #header h2 i { color: #38bdf8; }
        #menu-btn { background: none; border: none; color: white; font-size: 26px; cursor: pointer; padding: 10px; border-radius: 8px; }
        #menu-btn:hover { background: #1e293b; }

        /* Sidebar */
        #sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 350px; max-width: 90%; background: #1e293b; color: white; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 200; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); }
        
        .side-header { padding: 20px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .side-header h3 { font-size: 18px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        #close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }

        .upload-sec { padding: 15px; border-bottom: 1px solid #334155; }
        .upload-btn { display: block; width: 100%; padding: 15px; background: #38bdf8; color: black; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .upload-btn:hover { background: #7dd3fc; }
        input[type="file"] { display: none; }

        /* Menu Tree Structure */
        #menu-tree { flex: 1; overflow-y: auto; padding: 15px; }
        
        .root-folder { margin-bottom: 15px; }
        .root-btn { width: 100%; background: #334155; border: none; color: white; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .root-btn:hover { background: #475569; }
        .root-btn i { transition: transform 0.3s; }
        .root-btn.active i { transform: rotate(90deg); color: #38bdf8; }

        .sub-container { display: none; padding-left: 15px; margin-top: 10px; border-left: 2px solid #334155; }
        .sub-container.show { display: block; }
        
        .sub-folder { margin-bottom: 10px; }
        .sub-btn { width: 100%; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; }
        .sub-btn:hover { border-color: #38bdf8; color: white; }
        .sub-btn i { transition: transform 0.3s; }
        .sub-btn.active i { transform: rotate(90deg); color: #38bdf8; }

        .images-container { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; background: #0f172a; border-radius: 8px; margin-top: 5px; }
        .images-container.show { display: grid; }
        
        .seal-item { background: white; border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; aspect-ratio: 1; border: 2px solid transparent; transition: 0.2s; }
        .seal-item:hover { transform: scale(1.05); border-color: #38bdf8; }
        .seal-item img { max-width: 100%; max-height: 100%; object-fit: contain; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
        #overlay.show { display: block; }

        /* Main Area */
        #main-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        #pdf-controls { background: white; padding: 8px; display: none; justify-content: center; align-items: center; gap: 15px; border-bottom: 1px solid #e2e8f0; position: absolute; top: 0; left: 0; right: 0; z-index: 90; }
        #pdf-controls button { padding: 5px 15px; border: none; background: #0f172a; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; }
        
        #scroll-area { flex: 1; overflow: auto; padding: 20px; padding-top: 55px; display: flex; justify-content: center; }
        
        /* A4 Page */
        #a4-page { width: 794px; height: 1123px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; overflow: hidden; flex-shrink: 0; }
        @media (max-width: 850px) { #a4-page { width: 100%; max-width: 794px; height: auto; aspect-ratio: 210 / 297; } }

        #content-layer { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #content-layer img, #content-layer canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Seal Wrapper & Handles */
        .seal-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .handle { position: absolute; background: #fff; border: 2px solid #38bdf8; color: #38bdf8; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .move-handle { top: -20px; left: 50%; transform: translateX(-50%); width: 35px; height: 35px; cursor: grab; }
        .resize-handle { bottom: -20px; right: -20px; width: 30px; height: 30px; cursor: nwse-resize; font-size: 10px; }

        /* Toolbar */
        #toolbar { position: absolute; background: #0f172a; color: white; border-radius: 10px; padding: 8px; display: none; align-items: center; gap: 10px; z-index: 100; transform: translate(-50%, -180%); box-shadow: 0 8px 20px rgba(0,0,0,0.4); white-space: nowrap; }
        #toolbar button { background: none; border: none; color: white; font-size: 14px; padding: 8px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        #toolbar button:hover { background: #38bdf8; color: black; }
        #toolbar .danger:hover { background: #ef4444; color: white; }
        .tb-sep { width: 1px; height: 25px; background: #334155; }

        /* Bottom Action Buttons */
        #bottom-actions { position: fixed; bottom: 15px; right: 15px; background: #0f172a; padding: 8px; border-radius: 12px; display: flex; gap: 8px; z-index: 90; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #bottom-actions button { padding: 12px 18px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        /* Loader */
        #loader { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0f172a; padding: 20px; border-radius: 50%; z-index: 500; color: #38bdf8; }
        #loader i { font-size: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            #bottom-actions button { padding: 10px; font-size: 11px; }
            #bottom-actions button i { display: none; }
            #toolbar { width: 95%; justify-content: space-around; padding: 5px; }
        }

        @media print {
            body * { visibility: hidden; }
            #a4-page, #a4-page * { visibility: visible; }
            #a4-page { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
            #header, #sidebar, #bottom-actions, #toolbar, #overlay, #pdf-controls { display: none !important; }
        }
    </style>
</head>
<body>

    <header id="header">
        <button id="menu-btn" onclick="toggleSidebar(true)"><i class="fas fa-bars"></i></button>
        <h2><i class="fas fa-stamp"></i> প্রফেশনাল সিল অ্যাপ</h2>
        <div style="width: 40px;"></div>
    </header>

    <!-- Sidebar Menu -->
    <div id="sidebar">
        <div class="side-header">
            <h3><i class="fas fa-folder-tree"></i> সিল লাইব্রেরি</h3>
            <button id="close-btn" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="upload-sec">
            <label for="file-upload" class="upload-btn"><i class="fas fa-file-upload"></i> ডকুমেন্ট আপলোড করুন</label>
            <input id="file-upload" type="file" accept="application/pdf,image/*" onchange="handleFileUpload(event)">
        </div>

        <div id="menu-tree">
            <!-- JavaScript এখানে data.js থেকে মেনু তৈরি করবে -->
        </div>
    </div>
    <div id="overlay" onclick="toggleSidebar(false)"></div>

    <!-- Main Area -->
    <div id="main-area">
        <div id="pdf-controls">
            <button onclick="prevPage()"><i class="fas fa-chevron-left"></i> আগের</button>
            <span id="page-num" style="font-weight: bold;">১ / ১</span>
            <button onclick="nextPage()">পরের <i class="fas fa-chevron-right"></i></button>
        </div>

        <div id="scroll-area">
            <div id="a4-page">
                <div id="content-layer">
                    <div style="text-align: center; color: #94a3b8;">
                        <i class="fas fa-file-signature fa-5x" style="margin-bottom: 20px;"></i>
                        <h3>ডকুমেন্ট আপলোড করুন</h3>
                        <p style="margin-top:10px;">মেনু থেকে সিল সিলেক্ট করে পেজে বসান</p>
                    </div>
                </div>
                
                <div id="toolbar">
                    <button onclick="deleteSeal(this)"><i class="fas fa-trash"></i></button>
                    <div class="tb-sep"></div>
                    <button onclick="rotateSeal(this, -15)"><i class="fas fa-undo"></i></button>
                    <button onclick="rotateSeal(this, 15)"><i class="fas fa-redo"></i></button>
                    <div class="tb-sep"></div>
                    <button onclick="resizeSeal(this, -10)"><i class="fas fa-minus"></i></button>
                    <button onclick="resizeSeal(this, 10)"><i class="fas fa-plus"></i></button>
                    <div class="tb-sep"></div>
                    <input type="range" min="10" max="100" value="100" oninput="changeOpacity(this)" style="width: 60px; accent-color: #38bdf8;">
                </div>
            </div>
        </div>
    </div>

    <div id="bottom-actions">
        <button class="btn-danger" onclick="clearAll()"><i class="fas fa-eraser"></i> মুছুন</button>
        <button class="btn-warning" onclick="printPage()"><i class="fas fa-print"></i> প্রিন্ট</button>
        <button class="btn-success" onclick="downloadImage()"><i class="fas fa-download"></i> ডাউনলোড</button>
    </div>

    <div id="loader"><i class="fas fa-circle-notch"></i></div>

    <script>
        let currentPDF = null;
        let currentPage = 1;
        let totalPages = 1;
        let activeSeal = null;

        // Sidebar Toggle
        function toggleSidebar(show) {
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('overlay').classList.toggle('show', show);
        }

        // Build Menu from data.js
        function buildMenu() {
            const tree = document.getElementById('menu-tree');
            tree.innerHTML = '';

            sealData.forEach((root, idx) => {
                const rootDiv = document.createElement('div');
                rootDiv.className = 'root-folder';
                
                rootDiv.innerHTML = `
                    <button class="root-btn" onclick="toggleRoot(this)">
                        <span><i class="${root.icon}" style="color:#38bdf8; margin-right:10px;"></i>${root.name}</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <div class="sub-container" id="root-${idx}">
                        ${buildSubfolders(root.subfolders, idx)}
                    </div>
                `;
                tree.appendChild(rootDiv);
            });
        }

        function buildSubfolders(subfolders, rootIdx) {
            let html = '';
            subfolders.forEach((sub, sIdx) => {
                html += `
                    <div class="sub-folder">
                        <button class="sub-btn" onclick="toggleSub(this)">
                            <span><i class="${sub.icon}" style="color:#38bdf8; margin-right:8px;"></i>${sub.name}</span>
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="images-container" id="sub-${rootIdx}-${sIdx}">
                            ${buildImages(sub.images)}
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function buildImages(images) {
            let html = '';
            images.forEach(src => {
                // Fallback সিস্টেম: ছবি না পেলে একটি সুন্দর ডেমো দেখাবে
                html += `
                    <div class="seal-item" onclick="addSeal('${src}')">
                        <img src="${src}" onerror="this.src='https://placehold.co/100x100/png?text=Seal'">
                    </div>
                `;
            });
            return html;
        }

        function toggleRoot(btn) {
            btn.classList.toggle('active');
            const container = btn.nextElementSibling;
            container.classList.toggle('show');
        }

        function toggleSub(btn) {
            btn.classList.toggle('active');
            const container = btn.nextElementSibling;
            container.classList.toggle('show');
        }

        // File Upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            document.getElementById('loader').style.display = 'block';

            reader.onload = function(e) {
                const content = e.target.result;
                const container = document.getElementById('content-layer');
                container.innerHTML = '';

                if (file.type === 'application/pdf') {
                    const loadingTask = pdfjsLib.getDocument({ data: content });
                    loadingTask.promise.then(function(pdf) {
                        currentPDF = pdf;
                        totalPages = pdf.numPages;
                        currentPage = 1;
                        document.getElementById('pdf-controls').style.display = 'flex';
                        renderPDFPage(currentPage);
                    });
                } else {
                    currentPDF = null;
                    document.getElementById('pdf-controls').style.display = 'none';
                    const img = document.createElement('img');
                    img.src = content;
                    img.onload = function() {
                        img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'contain';
                        container.appendChild(img);
                        document.getElementById('loader').style.display = 'none';
                    };
                }
            };
            reader.readAsDataURL(file);
        }

        function renderPDFPage(num) {
            const container = document.getElementById('content-layer');
            currentPDF.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: 2.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width; canvas.height = viewport.height;

                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                    canvas.style.width = '100%'; canvas.style.height = '100%'; canvas.style.objectFit = 'contain';
                    container.appendChild(canvas);
                    document.getElementById('page-num').innerText = `${num} / ${totalPages}`;
                    document.getElementById('loader').style.display = 'none';
                });
            });
        }
        function nextPage() { if(currentPage < totalPages) { currentPage++; renderPDFPage(currentPage); } }
        function prevPage() { if(currentPage > 1) { currentPage--; renderPDFPage(currentPage); } }

        // Seal Management (Super User Friendly)
        function addSeal(imgSrc) {
            toggleSidebar(false); // মেনু বন্ধ হবে
            const page = document.getElementById('a4-page');
            const wrapper = document.createElement('div');
            wrapper.className = 'seal-wrapper';
            wrapper.style.width = '150px';
            wrapper.style.height = '150px';

            wrapper.innerHTML = `
                <div class="handle move-handle" onmousedown="startDrag(event, this.parentElement)"><i class="fas fa-arrows-alt"></i></div>
                <img src="${imgSrc}" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none;">
                <div class="handle resize-handle" onmousedown="startResize(event, this.parentElement)"><i class="fas fa-expand"></i></div>
            `;

            page.appendChild(wrapper);
            selectSeal(wrapper);
        }

        function selectSeal(element) {
            if (activeSeal) activeSeal.style.outline = 'none';
            activeSeal = element;
            activeSeal.style.outline = '2px dashed #38bdf8';

            const toolbar = document.getElementById('toolbar');
            toolbar.style.display = 'flex';
            const rect = element.getBoundingClientRect();
            const pageRect = document.getElementById('a4-page').getBoundingClientRect();
            
            toolbar.style.left = (rect.left - pageRect.left + rect.width / 2) + 'px';
            toolbar.style.top = (rect.top - pageRect.top) + 'px';

            if (window.innerWidth < 600) {
                toolbar.style.left = '50%';
                toolbar.style.top = '10px';
            }
        }

        function startDrag(e, wrapper) {
            e.preventDefault();
            const pageRect = document.getElementById('a4-page').getBoundingClientRect();
            const startX = e.clientX || (e.touches && e.touches[0].clientX);
            const startY = e.clientY || (e.touches && e.touches[0].clientY);
            const origLeft = wrapper.offsetLeft;
            const origTop = wrapper.offsetTop;

            selectSeal(wrapper);

            function move(e) {
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                let newLeft = origLeft + (clientX - startX);
                let newTop = origTop + (clientY - startY);
                
                // Bounds control
                if (newLeft < 0) newLeft = 0;
                if (newTop < 0) newTop = 0;
                if (newLeft + wrapper.offsetWidth > pageRect.width) newLeft = pageRect.width - wrapper.offsetWidth;
                if (newTop + wrapper.offsetHeight > pageRect.height) newTop = pageRect.height - wrapper.offsetHeight;

                wrapper.style.left = newLeft + 'px';
                wrapper.style.top = newTop + 'px';
            }

            function up() {
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
                document.removeEventListener('touchmove', move);
                document.removeEventListener('touchend', up);
            }

            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move);
            document.addEventListener('touchend', up);
        }

        function startResize(e, wrapper) {
            e.preventDefault();
            const startX = e.clientX || (e.touches && e.touches[0].clientX);
            const startY = e.clientY || (e.touches && e.touches[0].clientY);
            const startW = wrapper.offsetWidth;
            const startH = wrapper.offsetHeight;

            function move(e) {
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                const newW = startW + (clientX - startX);
                const newH = startH + (clientY - startY);
                
                if (newW > 50 && newH > 50) {
                    wrapper.style.width = newW + 'px';
                    wrapper.style.height = newH + 'px';
                }
            }

            function up() {
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
                document.removeEventListener('touchmove', move);
                document.removeEventListener('touchend', up);
            }

            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
            document.addEventListener('touchmove', move);
            document.addEventListener('touchend', up);
        }

        function deleteSeal(btn) {
            const wrapper = btn.closest('.seal-wrapper');
            if (wrapper) wrapper.remove();
            document.getElementById('toolbar').style.display = 'none';
            activeSeal = null;
        }

        function rotateSeal(btn, val) {
            if (!activeSeal) return;
            const img = activeSeal.querySelector('img');
            const currentRot = img.style.transform ? parseFloat(img.style.transform.replace('rotate(', '')) : 0;
            img.style.transform = `rotate(${currentRot + val}deg)`;
        }

        function resizeSeal(btn, val) {
            if (!activeSeal) return;
            const w = activeSeal.offsetWidth + val;
            const h = activeSeal.offsetHeight + val;
            if (w > 50 && h > 50) {
                activeSeal.style.width = w + 'px';
                activeSeal.style.height = h + 'px';
            }
        }

        function changeOpacity(input) {
            if (!activeSeal) return;
            activeSeal.style.opacity = input.value / 100;
        }

        function clearAll() {
            document.querySelectorAll('.seal-wrapper').forEach(el => el.remove());
            document.getElementById('toolbar').style.display = 'none';
            activeSeal = null;
            document.getElementById('content-layer').innerHTML = `
                <div style="text-align: center; color: #94a3b8;">
                    <i class="fas fa-file-signature fa-5x" style="margin-bottom: 20px;"></i>
                    <h3>ডকুমেন্ট আপলোড করুন</h3>
                </div>`;
            document.getElementById('pdf-controls').style.display = 'none';
            currentPDF = null;
        }

        function downloadImage() {
            document.getElementById('toolbar').style.display = 'none';
            const page = document.getElementById('a4-page');
            document.getElementById('loader').style.display = 'block';

            html2canvas(page, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'notary-document.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.getElementById('loader').style.display = 'none';
            });
        }

        function printPage() {
            document.getElementById('toolbar').style.display = 'none';
            window.print();
        }

        // Initialize
        window.onload = buildMenu;
    </script>
</body>
</html>
