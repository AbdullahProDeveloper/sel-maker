<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Notary Seal - পেশাদার নোটারি সিল অ্যাপ</title>
    
    <!-- ফন্ট অ্যাওসাম আইকন লাইব্রেরি -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <!-- PDF.js লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- HTML থেকে ক্যানভাস কনভার্টার -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- jsPDF লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- JSZip লাইব্রেরি (ZIP ফাইল তৈরি করার জন্য) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- ডাটা ফাইল (placeholder) -->
    <script>
        // ডিফল্ট ডাটা যদি data.js না থাকে
        var sealData = [
            { name_bn: 'সরকারি সিল', name_en: 'Govt Seal', icon: 'fas fa-landmark', subfolders: [
                { name_bn: 'জেলা প্রশাসক', name_en: 'DC Office', icon: 'fas fa-building', subfolders: [
                    { name_bn: 'নোটারি পাবলিক', name_en: 'Notary Public', icon: 'fas fa-stamp', images: ['data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="45" fill="%23e2e8f0" stroke="%234f46e5" stroke-width="2"/%3E%3Ctext x="50" y="55" font-size="18" text-anchor="middle" fill="%234f46e5" font-family="sans-serif"%3Eসিল ১%3C/text%3E%3C/svg%3E'] }
                ]}
            ]},
            { name_bn: 'ব্যক্তিগত', name_en: 'Personal', icon: 'fas fa-user', subfolders: [
                { name_bn: 'অ্যাডভোকেট', name_en: 'Advocate', icon: 'fas fa-gavel', subfolders: [
                    { name_bn: 'সুপ্রিম কোর্ট', name_en: 'Supreme Court', icon: 'fas fa-university', images: ['data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="45" fill="%23fef3c7" stroke="%23f59e0b" stroke-width="2"/%3E%3Ctext x="50" y="55" font-size="18" text-anchor="middle" fill="%23b45309" font-family="sans-serif"%3Eসিল ২%3C/text%3E%3C/svg%3E'] }
                ]}
            ]}
        ];
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
        :root { --primary:#4f46e5; --primary-light:#818cf8; --dark:#0f172a; --dark2:#1e293b; --border:#e2e8f0; --text:#1e293b; --text-light:#64748b; }
        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-track { background:#f1f5f9; }
        ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
        body { height:100vh; display:flex; flex-direction:column; overflow:hidden; background:linear-gradient(135deg,#f8fafc,#f1f5f9); color:var(--text); }

        /* হেডার */
        #header { height:55px; background:linear-gradient(135deg,#0f172a,#1e293b); border-bottom:2px solid var(--primary); color:white; display:flex; align-items:center; justify-content:space-between; padding:0 12px; z-index:100; flex-shrink:0; }
        .header-left, .header-right { display:flex; align-items:center; gap:8px; }
        .brand-icon { width:34px; height:34px; background:var(--primary); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; }
        .brand-title { font-size:14px; font-weight:800; }
        .brand-subtitle { font-size:9px; color:#94a3b8; }
        .header-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:7px 10px; border-radius:20px; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:5px; }
        .header-btn i { font-size:13px; }

        /* আপলোড বার */
        #quick-upload { background:var(--dark2); padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
        .upload-btn { background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:white; border:none; border-radius:10px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
        input[type="file"] { display:none; }

        /* সাইডবার */
        #sidebar { position:fixed; top:0; left:0; height:100%; width:330px; max-width:85%; background:var(--dark2); color:white; transform:translateX(-100%); transition:0.3s; z-index:200; display:flex; flex-direction:column; box-shadow:4px 0 20px rgba(0,0,0,0.3); }
        #sidebar.open { transform:translateX(0); }
        .side-header { padding:15px; background:rgba(2,6,23,0.9); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(79,70,229,0.3); }
        #close-btn { background:none; border:none; color:white; font-size:20px; cursor:pointer; }
        #sidebar-actions { padding:10px; display:flex; gap:5px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .side-action-btn { background:rgba(79,70,229,0.2); border:1px solid rgba(79,70,229,0.3); color:white; padding:8px; border-radius:8px; font-size:11px; cursor:pointer; flex:1; display:flex; align-items:center; justify-content:center; gap:5px; }
        #search-container { padding:10px; }
        .search-wrapper { position:relative; }
        .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:13px; }
        #search-input { width:100%; background:rgba(255,255,255,0.08); border:2px solid rgba(79,70,229,0.3); color:white; padding:10px 35px 10px 32px; border-radius:8px; font-size:13px; outline:none; }
        #search-input::placeholder { color:#94a3b8; }
        #search-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; font-size:14px; cursor:pointer; display:none; }
        #search-clear.visible { display:block; }
        #search-status { color:#94a3b8; font-size:10px; display:block; text-align:center; margin-top:4px; }
        #menu-tree { flex:1; overflow-y:auto; padding:10px; }
        .level-btn { width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white; padding:10px 12px; border-radius:8px; font-size:12px; font-weight:600; display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:6px; text-align:left; }
        .level-btn i { color:var(--primary-light); font-size:11px; transition:0.3s; }
        .level-btn.active i { transform:rotate(90deg); }
        .nested-container { display:none; padding-left:12px; border-left:2px solid rgba(79,70,229,0.3); margin-left:10px; }
        .nested-container.show { display:block; }
        .images-container { display:none; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; background:rgba(2,6,23,0.8); border-radius:8px; margin-top:8px; }
        .images-container.show { display:grid; }
        .seal-item { background:rgba(255,255,255,0.08); border-radius:8px; padding:6px; display:flex; justify-content:center; align-items:center; cursor:pointer; aspect-ratio:1; border:2px solid transparent; }
        .seal-item img { max-width:90%; max-height:90%; object-fit:contain; border-radius:50%; }
        #overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:150; display:none; }
        #overlay.show { display:block; }

        /* মূল এরিয়া */
        #main-area { flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden; }
        #controls-bar { background:white; padding:6px 10px; display:flex; justify-content:center; align-items:center; gap:6px; border-bottom:1px solid var(--border); position:absolute; top:0; left:0; right:0; z-index:90; box-shadow:0 2px 8px rgba(0,0,0,0.08); flex-wrap:wrap; }
        #controls-bar button { padding:4px 8px; border:1px solid var(--border); background:white; color:var(--text); border-radius:5px; font-size:10px; cursor:pointer; }
        #controls-bar input { width:40px; text-align:center; border:1px solid var(--border); border-radius:5px; padding:4px; font-size:10px; }
        #scroll-area { flex:1; overflow:auto; padding:10px; padding-top:55px; display:flex; flex-direction:column; align-items:center; background:linear-gradient(180deg,#f8fafc,#f1f5f9); }
        .page-container { position:relative; width:100%; max-width:794px; margin-bottom:20px; background:white; box-shadow:0 4px 15px rgba(0,0,0,0.1); border-radius:4px; overflow:hidden; }
        .a4-page { width:100%; aspect-ratio:210/297; background:white; position:relative; overflow:hidden; flex-shrink:0; }
        .a4-page canvas, .a4-page img { width:100% !important; height:100% !important; object-fit:contain !important; display:block; }
        .a4-page.current-page { box-shadow:inset 0 0 0 2px var(--primary); }
        .empty-state { text-align:center; padding:60px 20px; color:#94a3b8; background:white; border-radius:12px; margin:20px; max-width:400px; }
        .empty-state i { font-size:50px; margin-bottom:20px; color:#cbd5e1; }

        /* সিল */
        .seal-wrapper { position:absolute; z-index:10; user-select:none; cursor:move; touch-action:none; }
        .seal-wrapper.active-state { box-shadow:0 0 0 3px rgba(79,70,229,0.5), 0 8px 24px rgba(0,0,0,0.2); border-radius:50%; }
        .seal-img { width:100%; height:100%; object-fit:contain; pointer-events:none; border-radius:50%; }

        /* ছোট কাস্টমাইজড এডিটর */
        #seal-editor { position:fixed; bottom:10px; left:50%; transform:translateX(-50%) scale(0.9); background:linear-gradient(135deg,#1e293b,#0f172a); border-radius:16px; padding:10px; z-index:500; display:none; flex-direction:row; flex-wrap:wrap; gap:6px; max-width:95%; box-shadow:0 12px 40px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.15); opacity:0; transition:0.3s; align-items:center; }
        #seal-editor.show { display:flex; opacity:1; transform:translateX(-50%) scale(1); }
        .editor-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; width:38px; height:38px; border-radius:10px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:0.2s; }
        .editor-btn:hover { background:var(--primary); }
        .editor-btn.danger { background:rgba(239,68,68,0.2); }
        .editor-btn.success { background:rgba(16,185,129,0.3); }
        .editor-section { display:flex; align-items:center; gap:4px; }
        .editor-label { color:#94a3b8; font-size:9px; white-space:nowrap; }
        input[type="range"].editor-input { width:70px; height:4px; accent-color:var(--primary); }

        /* দ্রুত বাটন */
        #quick-seal-buttons { position:fixed; bottom:15px; left:10px; z-index:95; display:flex; flex-direction:column; gap:6px; }
        .quick-btn { width:44px; height:44px; border-radius:12px; background:var(--primary); border:none; color:white; font-size:16px; cursor:pointer; box-shadow:0 4px 12px rgba(79,70,229,0.3); display:flex; align-items:center; justify-content:center; position:relative; }
        .quick-btn-label { position:absolute; right:55px; background:var(--dark); color:white; padding:4px 8px; border-radius:6px; font-size:10px; white-space:nowrap; opacity:0; pointer-events:none; }
        .quick-btn:hover .quick-btn-label { opacity:1; }

        /* ডাউনলোড বাটন */
        #bottom-actions { position:fixed; bottom:15px; right:10px; z-index:95; display:flex; flex-direction:column; gap:6px; }
        #export-btn { background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:white; border:none; border-radius:12px; padding:12px 18px; font-size:12px; font-weight:bold; cursor:pointer; box-shadow:0 4px 15px rgba(79,70,229,0.4); display:flex; align-items:center; gap:6px; }
        #export-options { position:fixed; bottom:70px; right:10px; background:var(--dark2); border-radius:14px; padding:8px; display:none; flex-direction:column; gap:5px; z-index:300; min-width:170px; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); }
        #export-options.show { display:flex; }
        #export-options button { background:rgba(255,255,255,0.08); border:none; color:white; text-align:left; padding:10px 12px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12px; }
        #export-options button:hover { background:rgba(79,70,229,0.3); }

        /* টোস্ট */
        #toast { position:fixed; top:15px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--dark2); color:white; padding:12px 20px; border-radius:10px; font-size:13px; z-index:1000; display:flex; align-items:center; gap:8px; transition:0.3s; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
        #toast.show { transform:translateX(-50%) translateY(0); }

        #loader { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--dark); padding:25px; border-radius:50%; z-index:500; color:var(--primary-light); }
        #loader i { font-size:30px; animation:spin 1.5s linear infinite; }
        @keyframes spin { 100%{transform:rotate(360deg);} }

        @media (max-width:768px) {
            .brand-subtitle { display:none; }
            #controls-bar { padding:4px 6px; gap:4px; }
            #controls-bar button { padding:3px 6px; font-size:9px; }
            #seal-editor { padding:6px; gap:4px; }
            .editor-btn { width:34px; height:34px; font-size:14px; }
            input[type="range"].editor-input { width:55px; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="header-left">
            <button class="header-btn" onclick="toggleSidebar(true)"><i class="fas fa-bars"></i></button>
            <div class="brand-icon"><i class="fas fa-stamp"></i></div>
            <div>
                <div class="brand-title" id="title-text">নোটারি সিল অ্যাপ</div>
                <div class="brand-subtitle">Professional</div>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="toggleLanguage()"><i class="fas fa-globe"></i> <span id="lang-text">EN</span></button>
            <button class="header-btn" onclick="showHelp()"><i class="fas fa-question-circle"></i></button>
        </div>
    </header>

    <div id="quick-upload">
        <label for="file-upload" class="upload-btn"><i class="fas fa-cloud-upload-alt"></i> <span id="quick-upload-text">ডকুমেন্ট আপলোড করুন</span></label>
        <input id="file-upload" type="file" accept="application/pdf,image/*" onchange="handleFileUpload(event)">
    </div>

    <div id="sidebar">
        <div class="side-header">
            <h3><i class="fas fa-folder-tree"></i> <span id="sidebar-title">সিল লাইব্রেরি</span></h3>
            <button id="close-btn" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        <div id="sidebar-actions">
            <button class="side-action-btn" onclick="triggerSidebarUpload()"><i class="fas fa-cloud-upload-alt"></i> আপলোড</button>
            <button class="side-action-btn" onclick="downloadHDImage('png')"><i class="fas fa-download"></i> ডাউনলোড</button>
            <button class="side-action-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> রিফ্রেশ</button>
        </div>
        <div id="search-container">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="সিল খুঁজুন..." oninput="advancedSearch()">
                <button id="search-clear" onclick="clearSearch()"><i class="fas fa-times"></i></button>
            </div>
            <span id="search-status"></span>
        </div>
        <div id="menu-tree"></div>
    </div>
    <div id="overlay" onclick="toggleSidebar(false)"></div>

    <div id="main-area">
        <div id="controls-bar" style="display:none;">
            <button id="prev-btn" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
            <input type="number" id="page-jump" min="1" value="1" onchange="jumpToPage()">
            <span id="page-count-display">/ 1</span>
            <button id="next-btn" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
            <button onclick="changeZoom(-0.1)"><i class="fas fa-minus"></i></button>
            <span id="zoom-value">100%</span>
            <button onclick="changeZoom(0.1)"><i class="fas fa-plus"></i></button>
            <!-- ডাউনলোড বাটন (শুধু বর্তমান পেজ) -->
            <button onclick="downloadCurrentPage()" id="download-current-btn" style="background:var(--primary); color:white; border-color:var(--primary);"><i class="fas fa-download"></i> ডাউনলোড</button>
        </div>
        <div id="scroll-area">
            <div id="content-layer">
                <div class="empty-state"><i class="fas fa-file-upload"></i><h3 id="doc-placeholder">ডকুমেন্ট আপলোড করুন</h3><p id="doc-instruction">উপরের বাটনে ক্লিক করে PDF বা ছবি আপলোড করুন</p></div>
            </div>
        </div>
    </div>

    <!-- ছোট কাস্টমাইজড এডিটর -->
    <div id="seal-editor">
        <button class="editor-btn" onclick="moveSeal(0,-20)" title="উপরে"><i class="fas fa-arrow-up"></i></button>
        <button class="editor-btn" onclick="moveSeal(-20,0)" title="বামে"><i class="fas fa-arrow-left"></i></button>
        <button class="editor-btn" onclick="centerSeal()" title="কেন্দ্র"><i class="fas fa-crosshairs"></i></button>
        <button class="editor-btn" onclick="moveSeal(20,0)" title="ডানে"><i class="fas fa-arrow-right"></i></button>
        <button class="editor-btn" onclick="moveSeal(0,20)" title="নিচে"><i class="fas fa-arrow-down"></i></button>
        <div class="editor-section">
            <span class="editor-label">ছোট</span>
            <input type="range" class="editor-input" id="editor-size" min="50" max="200" value="120" oninput="editorSizeChange(this.value)">
            <span class="editor-label">বড়</span>
        </div>
        <button class="editor-btn" onclick="rotateSeal(-15)" title="ঘড়ির কাঁটার বিপরীতে"><i class="fas fa-undo"></i></button>
        <button class="editor-btn" onclick="resetRotation()" title="রিসেট"><i class="fas fa-undo-alt"></i></button>
        <button class="editor-btn" onclick="rotateSeal(15)" title="ঘড়ির কাঁটার দিকে"><i class="fas fa-redo"></i></button>
        <div class="editor-section">
            <span class="editor-label">১০%</span>
            <input type="range" class="editor-input" id="editor-opacity" min="10" max="100" value="100" oninput="editorOpacityChange(this.value)">
            <span class="editor-label">১০০%</span>
        </div>
        <button class="editor-btn" onclick="duplicateSeal()" title="কপি"><i class="fas fa-copy"></i></button>
        <button class="editor-btn danger" onclick="deleteSeal()" title="মুছুন"><i class="fas fa-trash"></i></button>
        <button class="editor-btn success" onclick="closeSealEditor()" title="বন্ধ করুন"><i class="fas fa-check"></i></button>
    </div>

    <div id="quick-seal-buttons">
        <button class="quick-btn" onclick="showRecentSeals()"><span class="quick-btn-label">সম্প্রতি</span><i class="fas fa-clock"></i></button>
        <button class="quick-btn" onclick="toggleSidebar(true)"><span class="quick-btn-label">লাইব্রেরি</span><i class="fas fa-th"></i></button>
    </div>

    <div id="bottom-actions">
        <button id="export-btn" onclick="toggleExportMenu()"><i class="fas fa-download"></i> <span id="export-text">ডাউনলোড</span></button>
    </div>

    <div id="export-options">
        <button onclick="downloadHDImage('png')"><i class="fas fa-image"></i> HD PNG</button>
        <button onclick="downloadHDImage('jpeg')"><i class="fas fa-file-image"></i> HD JPEG</button>
        <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF ডাউনলোড</button>
        <button onclick="printPage()"><i class="fas fa-print"></i> প্রিন্ট</button>
    </div>

    <div id="toast"><i class="fas fa-check-circle"></i> <span id="toast-message"></span></div>
    <div id="loader"><i class="fas fa-circle-notch"></i></div>

    <script>
        let currentPDF = null;
        let currentLang = 'bn';
        let toastTimeout;
        let currentZoom = 1.0;
        let currentPageNumber = 1;
        let totalPages = 1;
        let currentPageElement = null;
        let recentSeals = [];
        let activeSeal = null;
        let currentSealSrc = null;
        let allPages = [];

        const translations = {
            bn: {
                title: "নোটারি সিল অ্যাপ", sidebar: "সিল লাইব্রেরি", quick_upload: "ডকুমেন্ট আপলোড করুন",
                placeholder: "ডকুমেন্ট আপলোড করুন", instruction: "উপরের বাটনে ক্লিক করে PDF বা ছবি আপলোড করুন",
                export: "ডাউনলোড", toast_upload: "✓ ফাইল সফলভাবে আপলোড হয়েছে!", toast_error: "✗ PDF লোড করতে ব্যর্থ হয়েছে!",
                toast_seal: "✓ সিল যোগ করা হয়েছে!", toast_delete: "✓ সিল মুছে ফেলা হয়েছে!", toast_download: "✓ ডাউনলোড সম্পন্ন হয়েছে!",
                toast_print: "✓ প্রিন্ট করা হচ্ছে...", no_seal_error: "আগে সিল দিন তারপর ডাউনলোড করুন!"
            },
            en: {
                title: "Notary Seal App", sidebar: "Seal Library", quick_upload: "Upload Document",
                placeholder: "Upload your document", instruction: "Click above to upload PDF or image",
                export: "Download", toast_upload: "✓ File uploaded successfully!", toast_error: "✗ Failed to load PDF!",
                toast_seal: "✓ Seal added!", toast_delete: "✓ Seal deleted!", toast_download: "✓ Download completed!",
                toast_print: "✓ Printing...", no_seal_error: "Add a seal first then download!"
            }
        };

        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.className = type; t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(()=>t.classList.remove('show'), 2500);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            const tr = translations[currentLang];
            document.getElementById('title-text').innerText = tr.title;
            document.getElementById('sidebar-title').innerText = tr.sidebar;
            document.getElementById('quick-upload-text').innerText = tr.quick_upload;
            document.getElementById('doc-placeholder').innerText = tr.placeholder;
            document.getElementById('doc-instruction').innerText = tr.instruction;
            document.getElementById('export-text').innerText = tr.export;
            document.getElementById('lang-text').innerText = currentLang === 'bn' ? 'EN' : 'বাং';
            document.getElementById('search-input').placeholder = currentLang === 'bn' ? 'সিল খুঁজুন...' : 'Search seals...';
            buildMenu();
        }

        function showHelp() { showToast('কীভাবে ব্যবহার করবেন: ১. আপলোড ২. সিল নির্বাচন ৩. টেনে আনুন ৪. ক্লিক করে এডিটর', 'info'); }

        function toggleSidebar(show) { document.getElementById('sidebar').classList.toggle('open', show); document.getElementById('overlay').classList.toggle('show', show); }
        function toggleExportMenu() { document.getElementById('export-options').classList.toggle('show'); document.getElementById('seal-editor').classList.remove('show'); }
        function triggerSidebarUpload() { toggleSidebar(false); document.getElementById('file-upload').click(); }
        function showRecentSeals() { if(recentSeals.length===0) showToast('কোন সাম্প্রতিক সিল নেই'); else toggleSidebar(true); }

        function advancedSearch() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            document.getElementById('search-clear').classList.toggle('visible', !!q);
            const items = document.querySelectorAll('.seal-item');
            let count=0;
            items.forEach(item=>{
                const src = item.querySelector('img')?.src || '';
                const match = src.toLowerCase().includes(q);
                item.style.display = match ? 'flex' : 'none';
                if(match) count++;
            });
            document.getElementById('search-status').innerText = q ? `${count} টি সিল` : '';
            if(q) {
                document.querySelectorAll('.nested-container').forEach(n=>n.classList.add('show'));
                document.querySelectorAll('.images-container').forEach(c=>c.classList.add('show'));
            } else {
                document.querySelectorAll('.nested-container').forEach(n=>n.classList.remove('show'));
                document.querySelectorAll('.images-container').forEach(c=>c.classList.remove('show'));
            }
        }
        function clearSearch() { document.getElementById('search-input').value=''; document.getElementById('search-clear').classList.remove('visible'); document.getElementById('search-status').innerText=''; document.querySelectorAll('.seal-item').forEach(i=>i.style.display='flex'); }

        function buildMenu() {
            const tree = document.getElementById('menu-tree'); tree.innerHTML='';
            sealData.forEach(root => {
                const div = document.createElement('div');
                div.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span>${currentLang==='bn'?root.name_bn:root.name_en}</span><i class="fas fa-chevron-right"></i></button>`;
                const nested = document.createElement('div'); nested.className='nested-container';
                root.subfolders?.forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span>${currentLang==='bn'?sub.name_bn:sub.name_en}</span><i class="fas fa-chevron-right"></i></button>`;
                    const subNested = document.createElement('div'); subNested.className='nested-container';
                    sub.subfolders?.forEach(subSub => {
                        const ssDiv = document.createElement('div');
                        ssDiv.innerHTML = `<button class="level-btn" onclick="toggleLevel(this)"><span>${currentLang==='bn'?subSub.name_bn:subSub.name_en}</span><i class="fas fa-chevron-right"></i></button>`;
                        const ssNested = document.createElement('div'); ssNested.className='nested-container';
                        const imgC = document.createElement('div'); imgC.className='images-container';
                        subSub.images?.forEach(src => {
                            const item = document.createElement('div'); item.className='seal-item'; item.onclick=()=>addSeal(src);
                            item.innerHTML=`<img src="${src}" alt="seal" loading="lazy">`;
                            imgC.appendChild(item);
                        });
                        ssDiv.appendChild(imgC); subNested.appendChild(ssDiv);
                    });
                    subDiv.appendChild(subNested); nested.appendChild(subDiv);
                });
                div.appendChild(nested); tree.appendChild(div);
            });
        }
        function toggleLevel(btn) { btn.classList.toggle('active'); btn.nextElementSibling.classList.toggle('show'); }

        function handleFileUpload(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader(); document.getElementById('loader').style.display='block';
            reader.onload = function(e) {
                const arrayBuffer = e.target.result; const container = document.getElementById('content-layer'); container.innerHTML='';
                if(file.type==='application/pdf') {
                    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    pdfjsLib.getDocument({data:arrayBuffer}).promise.then(pdf=>{
                        currentPDF=pdf; totalPages=pdf.numPages; currentPageNumber=1;
                        document.getElementById('controls-bar').style.display='flex';
                        document.getElementById('page-count-display').innerText=`/ ${totalPages}`; document.getElementById('page-jump').max=totalPages; document.getElementById('page-jump').value=1;
                        allPages=[];
                        for(let i=1;i<=totalPages;i++) {
                            pdf.getPage(i).then(page=>{
                                const viewport=page.getViewport({scale:2}); const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
                                canvas.width=viewport.width; canvas.height=viewport.height;
                                page.render({canvasContext:ctx,viewport:viewport}).promise.then(()=>{
                                    const pc=document.createElement('div'); pc.className='page-container'; pc.dataset.pageNum=i;
                                    const pd=document.createElement('div'); pd.className='a4-page'; if(i===1){pd.classList.add('current-page'); currentPageElement=pd;}
                                    pd.style.display=(i===1)?'block':'none'; canvas.style.width='100%'; canvas.style.height='100%'; canvas.style.objectFit='contain';
                                    pd.appendChild(canvas); pc.appendChild(pd); container.appendChild(pc);
                                    allPages.push(pd);
                                    if(allPages.length===totalPages){ document.getElementById('loader').style.display='none'; showToast(translations[currentLang].toast_upload); }
                                });
                            });
                        }
                    }).catch(()=>{ document.getElementById('loader').style.display='none'; showToast(translations[currentLang].toast_error,'error'); });
                } else if(file.type.startsWith('image/')) {
                    currentPDF=null; document.getElementById('controls-bar').style.display='none';
                    const img=document.createElement('img'); img.src=URL.createObjectURL(file); img.onload=function(){
                        const pc=document.createElement('div'); pc.className='page-container'; const pd=document.createElement('div'); pd.className='a4-page current-page'; currentPageElement=pd;
                        img.style.width='100%'; img.style.height='100%'; img.style.objectFit='contain'; pd.appendChild(img); pc.appendChild(pd); container.appendChild(pc);
                        allPages=[pd]; document.getElementById('loader').style.display='none'; showToast(translations[currentLang].toast_upload);
                    };
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function nextPage(){ if(currentPageNumber<totalPages){ const pages=document.querySelectorAll('.a4-page'); pages.forEach(p=>p.classList.remove('current-page')); pages[currentPageNumber].classList.add('current-page'); currentPageElement=pages[currentPageNumber]; pages[currentPageNumber-1].style.display='none'; pages[currentPageNumber].style.display='block'; currentPageNumber++; document.getElementById('page-jump').value=currentPageNumber; document.getElementById('next-btn').disabled=(currentPageNumber===totalPages); document.getElementById('prev-btn').disabled=false; closeSealEditor(); }}
        function prevPage(){ if(currentPageNumber>1){ const pages=document.querySelectorAll('.a4-page'); pages.forEach(p=>p.classList.remove('current-page')); pages[currentPageNumber-2].classList.add('current-page'); currentPageElement=pages[currentPageNumber-2]; pages[currentPageNumber-1].style.display='none'; pages[currentPageNumber-2].style.display='block'; currentPageNumber--; document.getElementById('page-jump').value=currentPageNumber; document.getElementById('prev-btn').disabled=(currentPageNumber===1); document.getElementById('next-btn').disabled=false; closeSealEditor(); }}
        function jumpToPage(){ let v=parseInt(document.getElementById('page-jump').value)||1; if(v>totalPages)v=totalPages; const pages=document.querySelectorAll('.a4-page'); pages.forEach((p,i)=>{p.classList.remove('current-page'); p.style.display=(i===v-1)?'block':'none'; if(i===v-1){p.classList.add('current-page'); currentPageElement=p;}}); currentPageNumber=v; document.getElementById('prev-btn').disabled=(v===1); document.getElementById('next-btn').disabled=(v===totalPages); closeSealEditor(); }
        function changeZoom(d){ currentZoom=Math.max(0.5,Math.min(2.5,currentZoom+d)); document.getElementById('zoom-value').innerText=Math.round(currentZoom*100)+'%'; document.querySelectorAll('.page-container').forEach(p=>p.style.maxWidth=(794*currentZoom)+'px'); }

        function addSeal(src) {
            if(!currentPageElement){ showToast('প্রথমে ডকুমেন্ট আপলোড করুন','error'); return; }
            toggleSidebar(false);
            const wrap=document.createElement('div'); wrap.className='seal-wrapper normal-state'; wrap.style.width='120px'; wrap.style.height='120px'; wrap.style.left='50%'; wrap.style.top='50%'; wrap.style.transform='translate(-50%,-50%)';
            wrap.innerHTML=`<img src="${src}" class="seal-img" alt="seal">`;
            wrap.addEventListener('touchstart',(e)=>{e.stopPropagation(); activateSeal(wrap); startTouchDrag(e,wrap);},{passive:false});
            wrap.addEventListener('click',(e)=>{e.stopPropagation(); activateSeal(wrap); openSealEditor();});
            currentPageElement.appendChild(wrap);
            if(!recentSeals.includes(src)){recentSeals.unshift(src); if(recentSeals.length>5)recentSeals.pop();}
            showToast(translations[currentLang].toast_seal);
        }
        function startTouchDrag(e,wrap){ e.preventDefault(); const touch=e.touches[0]; const rect=wrap.parentElement.getBoundingClientRect(); const pr=wrap.parentElement; let startX=touch.clientX-rect.left, startY=touch.clientY-rect.top; let startLeft=wrap.offsetLeft, startTop=wrap.offsetTop;
            function move(ev){ ev.preventDefault(); const t=ev.touches[0]; let x=t.clientX-rect.left, y=t.clientY-rect.top; let nl=startLeft+(x-startX), nt=startTop+(y-startY); nl=Math.max(0,Math.min(nl,pr.offsetWidth-wrap.offsetWidth)); nt=Math.max(0,Math.min(nt,pr.offsetHeight-wrap.offsetHeight)); wrap.style.left=nl+'px'; wrap.style.top=nt+'px'; }
            function up(){ document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up); }
            document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);
        }
        function activateSeal(el){ document.querySelectorAll('.seal-wrapper').forEach(w=>w.classList.remove('active-state')); el.classList.add('active-state'); activeSeal=el; currentSealSrc=el.querySelector('.seal-img').src; }
        function openSealEditor(){ const editor=document.getElementById('seal-editor'); editor.classList.add('show'); if(activeSeal){ const size=parseInt(activeSeal.style.width)||120; document.getElementById('editor-size').value=size; const op=parseFloat(activeSeal.style.opacity||1)*100; document.getElementById('editor-opacity').value=op; } document.getElementById('export-options').classList.remove('show'); }
        function closeSealEditor(){ document.getElementById('seal-editor').classList.remove('show'); if(activeSeal){activeSeal.classList.remove('active-state'); activeSeal=null;} }
        function editorSizeChange(v){ if(activeSeal){ activeSeal.style.width=v+'px'; activeSeal.style.height=v+'px'; } }
        function editorOpacityChange(v){ if(activeSeal){ activeSeal.style.opacity=v/100; } }
        function centerSeal(){ if(activeSeal&&currentPageElement){ activeSeal.style.left='50%'; activeSeal.style.top='50%'; activeSeal.style.transform='translate(-50%,-50%)'; } }
        function moveSeal(dx,dy){ if(activeSeal){ activeSeal.style.left=(parseFloat(activeSeal.style.left)||0)+dx+'px'; activeSeal.style.top=(parseFloat(activeSeal.style.top)||0)+dy+'px'; } }
        function duplicateSeal(){ if(!activeSeal)return; const src=activeSeal.querySelector('.seal-img').src; const newS=activeSeal.cloneNode(true); newS.style.left=(parseFloat(activeSeal.style.left)+20)+'px'; newS.style.top=(parseFloat(activeSeal.style.top)+20)+'px'; newS.addEventListener('click',(e)=>{e.stopPropagation(); activateSeal(newS); openSealEditor();}); newS.addEventListener('touchstart',(e)=>{e.stopPropagation(); activateSeal(newS); startTouchDrag(e,newS);},{passive:false}); currentPageElement.appendChild(newS); }
        function resetRotation(){ if(activeSeal){ activeSeal.querySelector('.seal-img').style.transform='rotate(0deg)'; activeSeal.querySelector('.seal-img').dataset.rotation=0; } }
        function rotateSeal(angle){ if(activeSeal){ const img=activeSeal.querySelector('.seal-img'); const cur=parseFloat(img.dataset.rotation||0); const nr=cur+angle; img.style.transform=`rotate(${nr}deg)`; img.dataset.rotation=nr; } }
        function deleteSeal(){ if(activeSeal){ activeSeal.remove(); closeSealEditor(); showToast(translations[currentLang].toast_delete); } }
        function clearAllSeals(){ document.querySelectorAll('.seal-wrapper').forEach(s=>s.remove()); closeSealEditor(); }

        function hasSealOnCurrentPage(){ return currentPageElement?.querySelectorAll('.seal-wrapper').length > 0; }

        async function downloadCurrentPage(){
            if(!hasSealOnCurrentPage()){ showToast(translations[currentLang].no_seal_error,'error'); return; }
            closeSealEditor(); document.getElementById('export-options').classList.remove('show');
            const pc = currentPageElement?.closest('.page-container'); if(!pc) return;
            document.getElementById('loader').style.display='block';
            try {
                const canvas = await html2canvas(pc, {scale:3, useCORS:true});
                const imgData = canvas.toDataURL('image/png');
                const link=document.createElement('a'); link.download=`page-${currentPageNumber}.png`; link.href=imgData; link.click();
                document.getElementById('loader').style.display='none'; showToast(translations[currentLang].toast_download);
            } catch(e){ document.getElementById('loader').style.display='none'; showToast('✗ '+e.message,'error'); }
        }

        async function downloadHDImage(format){
            if(!document.querySelector('.seal-wrapper')){ showToast(translations[currentLang].no_seal_error,'error'); return; }
            closeSealEditor(); document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w=>w.classList.remove('active-state'));
            const pcs = document.querySelectorAll('.page-container'); if(!pcs.length) return;
            document.getElementById('loader').style.display='block';
            try {
                const zip = new JSZip(); const folder = zip.folder('pages');
                for(let i=0;i<pcs.length;i++){
                    const canvas = await html2canvas(pcs[i], {scale:3, useCORS:true});
                    const imgData = canvas.toDataURL(format==='jpeg'?'image/jpeg':'image/png');
                    if(pcs.length===1){ const a=document.createElement('a'); a.download=`document.${format}`; a.href=imgData; a.click(); }
                    else folder.file(`page-${i+1}.${format}`, imgData.split(',')[1], {base64:true});
                    await new Promise(r=>setTimeout(r,200));
                }
                if(pcs.length>1){ const blob=await zip.generateAsync({type:'blob'}); const a=document.createElement('a'); a.download='document.zip'; a.href=URL.createObjectURL(blob); a.click(); }
                document.getElementById('loader').style.display='none'; showToast(translations[currentLang].toast_download);
            } catch(e){ document.getElementById('loader').style.display='none'; showToast('✗ '+e.message,'error'); }
        }

        async function downloadPDF(){
            if(!document.querySelector('.seal-wrapper')){ showToast(translations[currentLang].no_seal_error,'error'); return; }
            closeSealEditor(); document.getElementById('export-options').classList.remove('show');
            const pcs = document.querySelectorAll('.page-container'); if(!pcs.length) return;
            document.getElementById('loader').style.display='block';
            try {
                const { jsPDF } = window.jspdf; const pdf = new jsPDF('p','mm','a4');
                for(let i=0;i<pcs.length;i++){
                    const canvas = await html2canvas(pcs[i], {scale:2, useCORS:true});
                    const imgData = canvas.toDataURL('image/jpeg',1.0);
                    if(i>0) pdf.addPage();
                    pdf.addImage(imgData,'JPEG',0,0,210,297);
                    await new Promise(r=>setTimeout(r,200));
                }
                pdf.save('document.pdf'); document.getElementById('loader').style.display='none'; showToast(translations[currentLang].toast_download);
            } catch(e){ document.getElementById('loader').style.display='none'; showToast('✗ '+e.message,'error'); }
        }

        function printPage(){
            if(!document.querySelector('.seal-wrapper')){ showToast(translations[currentLang].no_seal_error,'error'); return; }
            closeSealEditor(); document.getElementById('export-options').classList.remove('show');
            document.querySelectorAll('.seal-wrapper').forEach(w=>w.classList.remove('active-state'));
            showToast(translations[currentLang].toast_print); setTimeout(()=>window.print(),300);
        }

        document.addEventListener('click',(e)=>{ if(!e.target.closest('#export-options')&&!e.target.closest('#export-btn')&&!e.target.closest('#seal-editor')&&!e.target.closest('.seal-wrapper')){ document.getElementById('export-options').classList.remove('show'); closeSealEditor(); } });
        document.addEventListener('keydown',(e)=>{ if(e.key==='Delete'&&activeSeal)deleteSeal(); if(e.key==='Escape'){toggleSidebar(false); document.getElementById('export-options').classList.remove('show'); closeSealEditor();} });

        window.addEventListener('DOMContentLoaded',()=>{ buildMenu(); });
    </script>
</body>
